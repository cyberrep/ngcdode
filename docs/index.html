<title>Neo Geo CD SD Loader — SD</title>
<style>
:root{--bg:#07081a;--scr:#12142e;--row:#191c3d;--band1:#4a4e6b;--band2:#23263f;--gold:#e8b830;--yellow:#fad640;--red:#fa5454;--blue:#4284ff;--sky:#7fb0ff;--green:#3fc060;--fg:#f2f3ff;--dim:#9aa0c8;--edge:#5a6298;--olive:#57541f;
 --na:#ec4038;--nb:#f4ce34;--nc:#40c460;--nd:#4882f0}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.45 ui-monospace,"Cascadia Mono","DejaVu Sans Mono",Consolas,Menlo,monospace;overflow-wrap:anywhere;
 background:radial-gradient(1200px 600px at 50% -10%,#1b1f4a 0,var(--bg) 70%) no-repeat,var(--bg);padding:18px 12px 40px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.tv{max-width:1100px;margin:0 auto;background:var(--scr);border:3px solid #2a2e55;border-radius:14px;box-shadow:0 20px 60px #0009,inset 0 0 0 1px #000;overflow:hidden}
.band{background:linear-gradient(180deg,var(--band1),var(--band2));display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:52px}
.band.top{border-bottom:2px solid var(--gold)}
.band.bot{border-top:2px solid var(--gold);flex-wrap:nowrap;min-height:46px;overflow-x:auto}
.band img{height:30px;width:auto;display:block;image-rendering:pixelated}
.band h1{margin:0;font-size:1rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;flex:1;text-align:center}
.vers{font-size:11px;line-height:1.5;letter-spacing:.08em;color:var(--dim);white-space:nowrap;text-align:left}
.vers b{color:var(--gold);font-weight:700}
.vers span{color:#fff}
@media(max-width:700px){.vers{display:none}}
.langs{display:flex;gap:4px}
.langs button{background:#0e1026;border:1px solid var(--edge);border-radius:6px;padding:3px 9px;color:var(--dim);font-weight:700;letter-spacing:.08em}
.langs button.on{background:var(--yellow);border-color:var(--yellow);color:#16183a}
.key{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;white-space:nowrap;font-size:.92em}
.key i{font-style:normal;display:grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:var(--gold);color:#16183a;font-size:.85rem;letter-spacing:0;box-shadow:inset 0 -2px 0 #0005}
.key i.A{background:var(--na)}.key i.B{background:var(--nb)}.key i.C{background:var(--nc)}.key i.D{background:var(--nd);color:#fff}.key i.S{background:#cfd4f0;font-size:.62rem;letter-spacing:.05em}
.key:hover{color:var(--yellow)}.key[disabled]{opacity:.35;cursor:not-allowed}
.gap{flex:1}
.view{padding:16px 16px 18px;min-height:430px}
.note{color:var(--dim);margin:0 0 12px}
.warn{border:2px solid var(--red);background:#3a1420;border-radius:10px;padding:10px 14px;margin:0 0 14px}
.warn b{color:#ffb0b0}
.tip{display:flex;gap:12px;align-items:center;margin:12px 0 0;padding:9px 14px;border:2px solid #8fd6ff;border-radius:10px;background:linear-gradient(180deg,#2a6fb8,#143a6e);color:#fff;font-size:13px;line-height:1.35}
.tip b{color:var(--gold);letter-spacing:.06em}
.tipk{display:grid;gap:6px;margin-top:8px}.tipk>div{display:flex;gap:10px;align-items:center}.tipk p{margin:0}
.tipk span{flex:0 0 34px;height:28px;display:grid;place-items:center;background:#0b1d3c;border:1px solid #8fd6ff;border-radius:6px}.tipk svg{width:24px;height:20px}
.tip i{flex:0 0 30px;height:30px;border-radius:50%;background:radial-gradient(circle,#10122a 0 14%,#e8eef8 15% 30%,#9fd0ff 31% 78%,#dfe6f2 79% 100%);box-shadow:0 0 0 2px #0a0c1e}

/* ---- menu principal ---- */
.home{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(10,1fr);column-gap:14px;row-gap:0;height:300px}
.tile{position:relative;border:3px solid #0006;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;
 color:#fff;font-weight:700;letter-spacing:.12em;font-size:1.05rem;text-shadow:0 2px 0 #0008;text-align:center}
.tile::before{content:"";position:absolute;left:14%;right:14%;top:9px;height:2px;background:#fff6;border-radius:2px}
.tile,.pv .tl{overflow:hidden}
.tile::after,.pv .tl.sel::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:26%;transform:translateX(-160%) skewX(-28deg);pointer-events:none;
 background:linear-gradient(90deg,transparent,#fff9 45%,#fff 50%,#fff9 55%,transparent)}
.tile.sel::after{animation:shine0 .45s .33s 1 linear}.tile:not([disabled]):hover::after,.tile:not([disabled]):focus-visible::after{animation:shine .45s .33s 1 linear}
@keyframes shine0{0%{transform:translateX(-160%) skewX(-28deg)}100%{transform:translateX(560%) skewX(-28deg)}}
@keyframes shine{0%{transform:translateX(-160%) skewX(-28deg)}100%{transform:translateX(560%) skewX(-28deg)}}
.pv .tl.sel{outline:1px solid #fff}
@keyframes shinepv{0%,82%{transform:translateX(-160%) skewX(-28deg)}100%{transform:translateX(560%) skewX(-28deg)}}
.pv .tl.sel::after{animation:shinepv 2.6s .33s infinite linear}
@media (prefers-reduced-motion:reduce){.tile::after,.pv .tl.sel::after{animation:none!important}}
.tile small{font-weight:400;letter-spacing:.06em;font-size:.85rem;opacity:.95}
.tile svg{width:54px;height:54px}.tile img.pad{width:min(130px,60%);height:auto;filter:drop-shadow(0 3px 0 #0006)}
.tile:hover,.tile:focus-visible{border-color:#fff;outline:0}
.tile[disabled]{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.t-gold{background:linear-gradient(180deg,#e6bd39,#7b5208)}.t-red{background:linear-gradient(180deg,#e6524a,#7b1818)}
.t-blue{background:linear-gradient(180deg,#4183ff,#102983);grid-row:5/11;grid-column:2}
.t-wiz{background:linear-gradient(180deg,#8fd6ff,#2a7fd0);grid-row:1/5;grid-column:2;gap:5px}
.t-wiz .cd{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#10122a 0 14%,#e8eef8 15% 30%,#9fd0ff 31% 78%,#fff 79% 100%);box-shadow:0 0 0 2px #0a0c1e,0 3px 0 #0006}
.t-gold,.t-green{grid-row:1/6}.t-red,.t-gray{grid-row:6/11}.t-gold,.t-red{grid-column:1}.t-green,.t-gray{grid-column:3}
.t-gold,.t-green,.t-wiz{margin-bottom:7px}.t-red,.t-gray,.t-blue{margin-top:7px}
.wiz{padding:10px 18px 0}
.wsteps{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px;border:2px solid var(--edge);border-radius:10px;background:#0e1026}
.wsteps b{color:var(--gold);letter-spacing:.14em;margin-right:6px}
.wsteps span{display:inline-flex;align-items:center;gap:6px;color:var(--dim);letter-spacing:.06em}
.wsteps i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#2a2e55;color:var(--dim);font-size:.8rem;font-weight:700}
.wsteps .on{color:#fff;font-weight:700}.wsteps .on i{background:var(--gold);color:#16183a}
.wsteps .ok i{background:var(--green);color:#06210f}
.help{list-style:none;counter-reset:h;margin:0 0 14px;padding:0}
.help li{counter-increment:h;display:flex;gap:12px;align-items:flex-start;margin:0 0 8px;padding:10px 14px;border:2px solid #3a4a86;border-radius:10px;background:#141a3a;line-height:1.4}
.help li::before{content:counter(h);flex:0 0 28px;height:28px;border-radius:50%;background:var(--gold);color:#10122a;font-weight:700;text-align:center;line-height:28px}
.help b{flex:0 0 76px;color:var(--gold);letter-spacing:.04em;padding-top:4px}
.help span{flex:1;padding-top:4px}
.news{display:flex;gap:12px;align-items:center;margin:12px 0 0;padding:9px 14px;border:2px solid var(--gold);border-radius:10px;background:linear-gradient(180deg,#5a4a12,#2e2608);color:#fff;font-size:13px;line-height:1.35}
.news>div{flex:1}.news b{color:var(--gold);letter-spacing:.06em}
.news .nh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 4px}
.news button{background:#0e1026;border:1px solid var(--gold);border-radius:6px;padding:3px 12px;color:var(--gold);font:inherit;font-weight:700;letter-spacing:.06em;cursor:pointer}
.news ul{margin:8px 0 10px;padding-left:20px}.news li{margin:0 0 3px}
.ren{max-height:330px;overflow-y:auto;border:2px solid var(--edge);border-radius:8px;background:#0e1026;padding:4px 8px;margin:8px 0;scrollbar-color:var(--edge) transparent}
.rbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.rbatwrap{text-align:center;margin-top:18px;border-top:1px solid var(--edge);padding-top:14px}
.rbatwrap .note{margin-top:8px}
.ren label{display:flex;gap:9px;align-items:flex-start;padding:4px 2px;border-bottom:1px solid #1c2048;cursor:pointer}
.ren input{margin-top:4px;width:16px;height:16px;accent-color:var(--yellow);flex:none}
.ren u{display:inline-block;width:42px;text-decoration:none;color:var(--dim);font-size:.72rem;letter-spacing:.1em;font-weight:700;text-indent:0}
.ren b u{color:var(--gold)}.ren label small,.ren label b{display:block;padding-left:42px;text-indent:-42px}
.ren-to{display:block;width:100%;margin:3px 0 2px;background:#0b0d22;border:1px solid var(--edge);border-radius:5px;color:var(--gold);font:inherit;font-size:.92em;padding:4px 8px}
.dd{text-decoration:none;border-radius:3px;padding:0 1px;white-space:pre-wrap}del.dd{background:#7a2230;color:#ffd0d0}ins.dd{background:#1f6a3a;color:#d6ffe2}
.mini{background:#0e1026;border:1px solid var(--edge);border-radius:5px;padding:1px 8px;color:var(--sky);font:inherit;font-size:.8em;cursor:pointer;margin-left:4px}.miss>div>.mini{margin:8px 0 0}
.t-green{background:linear-gradient(180deg,#48be78,#0e522e)}.t-gray{background:linear-gradient(180deg,#8b94a4,#313141)}
.last{margin-top:14px;border:2px solid var(--edge);border-radius:10px;background:#0e1026;padding:10px 14px;display:flex;gap:14px;align-items:center;min-height:74px}
.last b{color:var(--fg)}.last .l1{color:var(--dim);letter-spacing:.14em}.last .l3{color:var(--sky)}
.disc{flex:none;width:48px;height:48px;border-radius:50%;background:conic-gradient(#cfd4f0,#7d86b8,#e9ecff,#8d95c6,#cfd4f0);position:relative}
.disc::after{content:"";position:absolute;inset:17px;border-radius:50%;background:#0e1026}

/* ---- lista de jogos ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{background:var(--row);border:1px solid #2c3160;border-radius:999px;padding:3px 12px;color:var(--dim)}
.chips button.on{background:var(--olive);border-color:#fff;color:#fff}
.games{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}
.games>div:first-child{position:relative;min-height:300px}
.list{position:absolute;inset:0;overflow-y:auto;padding-right:4px;scrollbar-color:var(--edge) transparent}   /* mesma altura do painel da direita: preenche sem crescer */
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:12px 2px 2px;color:var(--gold);letter-spacing:.08em;font-weight:700}.mhead small{color:var(--dim);font-weight:400;letter-spacing:0}
.txl{display:block;margin:8px 0}.txl span{display:block;color:var(--dim);font-size:.82rem;margin-bottom:2px}.txl input,.txl textarea{width:100%;background:#0b0d22;border:1px solid var(--edge);border-radius:6px;color:var(--fg);padding:6px 9px;font:inherit}.txl textarea{resize:vertical}.txbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.list button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--row);border:2px solid transparent;border-radius:7px;padding:5px 10px;margin:0 0 5px;letter-spacing:.1em}
.list button>span:first-child{flex:1;min-width:0}
.list button.on{background:var(--olive);border-color:#fff}
.marks{display:flex;gap:3px;flex:none}
.reg{flex:none;color:var(--dim);font-size:.7rem;letter-spacing:.06em;border:1px solid var(--edge);border-radius:4px;padding:0 5px;margin-right:2px}
.lkm{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:16px}
.lkbox{background:var(--scr);border:2px solid var(--gold);border-radius:12px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:14px 18px}
.lkh{display:flex;justify-content:space-between;align-items:center;color:var(--gold);letter-spacing:.1em}.lkbox h4{color:var(--gold);margin:14px 0 6px;font-size:.85em;letter-spacing:.08em}
.lkg{margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.lksug{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lkc{display:flex;align-items:center;gap:8px;width:100%;background:var(--row);border:1px solid var(--edge);border-radius:8px;color:var(--fg);font:inherit;padding:6px 10px;cursor:pointer;text-align:left;margin:0 0 4px}
.lkc:hover,.lkc.on{border-color:var(--gold)}.lkc>span:first-of-type{flex:1}.lkc.lkbig{flex-direction:column;align-items:stretch;text-align:center;margin:0}
.lkc.lkbig img,.lkc .noimg{width:100%;aspect-ratio:1;object-fit:contain;background:#0b0d22;border-radius:6px}.lkc .noimg{display:grid;place-items:center;color:#454a78;font-size:2em}.lkc.lkbig .marks{justify-content:center}
#lkq{width:100%;box-sizing:border-box;background:#0b0d22;border:1px solid var(--edge);border-radius:8px;color:var(--fg);font:inherit;padding:8px 10px}.lkr{margin-top:8px;max-height:40vh;overflow:auto}
.lkk{border:1px solid var(--edge);border-radius:8px;padding:8px 10px;margin:0 0 8px;background:#0e1026}.lkkh{display:flex;gap:8px;align-items:center;margin-bottom:6px}.lkkh span{color:var(--dim);font-size:.85em}
.lkthumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.lkt{flex:0 0 96px;background:var(--row);border:1px solid var(--edge);border-radius:6px;padding:3px;cursor:pointer;color:var(--dim);font:inherit;font-size:.65em}
.lkt:hover{border-color:var(--gold)}.lkt img{width:100%;aspect-ratio:1;object-fit:contain;background:#0b0d22;display:block}.lkt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lkgo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.lkgo a.mini{text-decoration:none;margin:0}.lkdrop{border:1px dashed var(--edge);border-radius:6px;padding:2px 10px;color:var(--dim);font-size:.8em}
.lkmsg{color:var(--green);margin:6px 0 0}
.lkown{display:flex;gap:10px;align-items:center;margin:0 0 8px;padding:6px;border:1px solid var(--green);border-radius:8px;background:#0b1a14}.lkown img{width:72px;height:72px;object-fit:contain;background:#0b0d22;border-radius:4px}
.lkown .mini{margin:6px 0 0}.lkt.on{border-color:var(--green)}
.lkname{background:none;border:0;color:var(--sky);font:inherit;padding:0;cursor:pointer;text-decoration:underline dotted;text-align:left}
.lkbtn{display:block;width:100%;margin:8px 0 0;background:#0e1026;border:1px solid var(--gold);border-radius:8px;color:var(--yellow);font:inherit;padding:6px;cursor:pointer}.lkon{margin:4px 0 0;font-size:.85em;color:var(--dim)}
.vol{display:inline-flex;gap:2px;vertical-align:middle}.vol i{width:9px;height:13px;background:#2c3160;border-radius:2px}.vol i.f{background:var(--sky)}
.mk{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;font-size:.68rem;font-weight:800;letter-spacing:0;color:#0b0d22;font-style:normal}
.mk.card{background:var(--green)}.mk.lib{background:var(--blue);color:#fff}.mk.own{background:var(--yellow)}.mk.retro{background:#f08a24}.mk.none{background:transparent;border:1px solid #454a78;color:#666c9c}
.side{border-left:2px solid var(--edge);padding-left:12px;min-width:0}
.cover{border:3px solid #414a9c;border-radius:6px;background:linear-gradient(#282e50,#0a0c18);width:206px;height:206px;margin:0 auto 8px;display:grid;place-items:center;position:relative;overflow:hidden}
.cover canvas{width:200px;height:200px;image-rendering:pixelated;display:block}
.cover canvas.shot{height:150px;margin-top:32px}
.cover .disc{width:100px;height:100px;transform:translateY(-16px)}.cover .disc::after{inset:36px}
.cover .strip{position:absolute;left:3px;right:3px;top:3px;height:32px;background:#0008;display:flex;align-items:center;justify-content:space-between;padding:0 8px;letter-spacing:.1em;text-shadow:0 1px 0 #000}
.cover .strip.bot{top:auto;bottom:3px}
.cover .strip i{font-style:normal;color:#ffd640;font-size:16px;line-height:1;text-shadow:1px 1px 0 #784c08,-1px -1px 0 #784c08}
.cover .none{position:absolute;bottom:34px;left:0;right:0;text-align:center;color:var(--dim);letter-spacing:.12em}
.kinds{display:grid;gap:4px}
.kinds div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kinds span{flex:1;min-width:0;color:var(--dim);white-space:nowrap}
.kinds button{white-space:nowrap}
.kinds button{background:#0e1026;border:1px solid var(--edge);border-radius:6px;padding:1px 8px;color:var(--sky)}
.pvnote{color:var(--dim);font-size:.82rem;text-align:center;margin:0 0 8px}
.info{margin-top:10px;border:2px solid var(--edge);border-radius:8px;background:#0e1026;padding:6px 12px;display:flex;gap:12px;align-items:flex-end}
.info div{flex:1;min-width:0}.info .a{color:var(--fg)}.info .b{color:var(--gold)}.info .n{color:var(--gold);flex:none}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--dim);margin-top:8px;font-size:.88rem}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* ---- opções ---- */
.panel{border:2px solid var(--edge);border-radius:10px;background:#0e1026;padding:8px 12px 12px}
.panel h2{margin:0 0 6px;padding:2px 2px 6px;font-size:1rem;letter-spacing:.14em;border-bottom:2px solid var(--gold)}
.hdr{display:flex;width:100%;text-align:left;background:none;border:0;padding:5px 8px;color:var(--yellow);letter-spacing:.2em;border-radius:5px}
.hdr.on{background:var(--olive)}.hdr::after{content:"›";margin-left:auto}.hdr.on::after{content:"▾"}
.opt{display:flex;width:100%;gap:10px;align-items:center;background:none;border:2px solid transparent;border-radius:6px;padding:3px 8px 3px 26px;text-align:left;letter-spacing:.12em}
.opt.top{padding-left:8px}
.opt:hover,.opt:focus-visible{background:#191c3d;border-color:#fff;outline:0}
.opt span{flex:1;min-width:0}.opt b{color:var(--sky);font-weight:400;text-align:right}
.opt.act b{color:var(--yellow)}

/* ---- prévia do menu do console (320 x 224, como a tela do Neo Geo) ---- */
.optgrid{display:grid;grid-template-columns:minmax(0,1fr) 404px;gap:14px;align-items:start}
.pvwrap{position:sticky;top:10px}
.pvcap{color:var(--dim);letter-spacing:.14em;margin:0 0 6px;text-align:center}
.pv{width:320px;height:224px;zoom:1.25;margin:0 auto;position:relative;overflow:hidden;border:2px solid #000;border-radius:4px;background:radial-gradient(ellipse at 50% 0,#22264a,#10121f 75%);color:#fff;font:9px/1.15 ui-monospace,Consolas,Menlo,monospace;letter-spacing:.06em}
.pv *{position:absolute}
.pv .tb{left:0;right:0;top:0;height:28px;background:linear-gradient(180deg,#848894,#343740);border-bottom:1px solid var(--gold)}
.pv .tbs{left:0;right:0;top:0;height:19px;background:linear-gradient(180deg,#787c88,#343740);border-bottom:1px solid var(--gold)}
.pv .bb{left:0;right:0;bottom:0;height:27px;background:linear-gradient(180deg,#848894,#343740);border-top:1px solid var(--gold)}
.pv .bbs{left:0;right:0;bottom:0;height:22px;background:linear-gradient(180deg,#787c88,#343740);border-top:1px solid var(--gold)}
.pv .ct{left:0;right:0;top:5px;text-align:center;letter-spacing:.2em}
.pv .tl{border-radius:7px;border:2px solid #fff6;display:grid;place-items:center;text-align:center;font-weight:700;text-shadow:0 1px 0 #000}
.pv .tl>*{position:static}
.pv .rw{left:16px;height:14px;background:#101628;border-radius:3px;padding:2px 6px;white-space:nowrap;overflow:hidden}
.pv .rw.on{background:var(--olive);outline:1px solid #fff}
.pv .rw.sp{color:var(--yellow)}
.pv .cv{border-radius:2px;display:grid;place-items:center;text-align:center;font-size:6px;line-height:1.1;padding:2px;color:#fff;text-shadow:0 1px 0 #000;overflow:hidden}
.pv .cv>*{position:static}
.pv .box{border:1px solid var(--edge);border-radius:3px;background:#0e1026}
.pv .dim{color:var(--dim)}.pv .sky{color:var(--sky)}.pv .gd{color:var(--gold)}
.pv .nb{display:inline-block;position:static;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:-1px}
@keyframes pvmq{0%,20%{transform:translateX(0)}80%,100%{transform:translateX(-40%)}}
@media (max-width:900px){.optgrid{grid-template-columns:1fr}.pvwrap{position:static}.pv{zoom:1}}

/* ---- gravar ---- */
.big{display:inline-block;background:linear-gradient(180deg,#48be78,#0e522e);border:3px solid #0006;border-radius:12px;padding:12px 26px;color:#fff;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 0 #0008}
.big:hover{border-color:#fff}.big[hidden]{display:none}.big[disabled]{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.big.stop{background:linear-gradient(180deg,#8b94a4,#313141)}
.prog{height:26px;border:2px solid var(--edge);border-radius:6px;background:#0b0d22;position:relative;overflow:hidden;margin:14px 0 6px}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue);transition:width .15s}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #000}
.now{color:var(--dim);min-height:1.5em}
.steps{display:grid;gap:3px;margin:6px 0 2px}
.steps div{display:flex;gap:10px;align-items:center;background:var(--row);border-radius:6px;padding:3px 10px;letter-spacing:.1em}
.steps span{flex:1;min-width:0}.steps b{font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}
.steps .run{outline:1px solid #fff;background:var(--olive)}.steps .run b{color:#fff}.steps .ok b{color:#8ff0a8}
pre{margin:8px 0 0;max-height:190px;overflow:auto;background:#0b0d22;border:1px solid #2c3160;border-radius:8px;padding:8px 12px;font:13px/1.45 inherit;color:#c8ccf0;white-space:pre-wrap}
.done{margin-top:12px;border:2px solid var(--green);border-radius:10px;padding:10px 14px;background:#10301c}
.done h3{margin:0 0 4px;color:#8ff0a8;letter-spacing:.14em;text-transform:uppercase;font-size:1rem}
.misshead{display:flex;align-items:center;gap:12px;margin:14px 0 6px;letter-spacing:.14em;text-transform:uppercase}.misshead b{flex:1;color:var(--yellow)}
.miss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:10px}
.miss>div{border:2px solid var(--edge);border-radius:8px;background:#0e1026;padding:6px 10px;min-width:0}
.miss h4{margin:0 0 4px;padding-bottom:4px;border-bottom:1px solid var(--gold);letter-spacing:.12em;font-size:.95rem;display:flex}.miss h4 span{margin-left:auto;color:var(--gold)}
.miss ul{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto;scrollbar-color:var(--edge) transparent}.miss li{padding:1px 0;color:#c8ccf0}
footer{max-width:980px;margin:14px auto 0;color:var(--dim);font-size:.85rem;text-align:center}
footer a{color:var(--yellow)}
@media (max-width:760px){
 .home{grid-template-columns:1fr 1fr;grid-template-rows:auto;height:auto;row-gap:14px}.home .tile{grid-row:auto;grid-column:auto;margin:0}.home .t-wiz{grid-column:1/3;order:-2}.home .t-blue{grid-column:1/3;order:-1}.tile{min-height:110px}
 .games{grid-template-columns:1fr}.side{border-left:0;border-top:2px solid var(--edge);padding:12px 0 0}.list{position:static;height:300px}
 .band h1{font-size:.85rem;letter-spacing:.12em}.band img{height:22px}
}
.man{margin-bottom:12px;line-height:1.5}.man p,.man li{margin:6px 0}.man code{background:rgba(255,255,255,.08);padding:0 4px;border-radius:3px}
.man a{color:#8fb8ff}.leds{width:100%;border-collapse:collapse;font-size:.9em}.leds td{padding:4px 6px;border-top:1px solid rgba(255,255,255,.1);vertical-align:top}.leds td:first-child{white-space:nowrap;color:#ffd75e}
</style>
</head>

const RETRO_API = "https://api.github.com/repos/libretro-thumbnails/SNK_-_Neo_Geo_CD/git/trees/master?recursive=1";

/* Os arquivos do menu (BOOT.PRG, BOOT.SPR...), comprimidos: a página monta o _BOOT/BOOT.ISO sozinha. */
const MENU_VERSION = "100";
/* "MENU 100" -> "1.0", "MENU 101" -> "1.01", "MENU 70" -> "0.70" (o mesmo do Sobre do menu) */
const menuTxt = v => { const n = Number(v) || 0; return n >= 100 ? (n / 100).toFixed(2).replace(/0$/, "") : "0." + String(n).padStart(2, "0"); };
const LOADER_VER = "NGCD 00.12";                  /* o loader (BIOS) que combina com este menu */
/* Selo de versão no cabeçalho, no estilo do 3DO: BOOT (o menu) e LOADER (o firmware). */
function drawVers(){

const CHANGES = {"pt": [["Menu 1.0 + firmware NGCD 00.12", "Primeira versão pública.", ["Barras do SD e da NVRAM no topo redesenhadas: nome na letra do menu com sombra, trilho escuro e o espaço livre alinhado à direita, com as letras mais juntas.", "Protetor de tela como no 3DO: o nosso logo e cada console, um de cada vez, passeando pela tela escura; a cada 2 batidas na borda troca. Os textos e as barras do menu não aparecem mais por cima.", "Nome comprido rola até o fim: com o MCU NGCD 00.12 o menu lê o nome inteiro da pasta (até 63 letras) e o título inteiro do gamelist.", "Capa padrão com os cantos arredondados, como as capas de verdade.", "Carrossel FX mais fluido: lê antes as capas para o lado em que você anda, 2 passos à frente.", "Drive de CD: saiu a opção Iniciar pelo drive de CD (a caixa CD do menu principal já faz isso).", "Firmware: o loader aparece como NGCD 12 (NGCD 00.12) também na tela do SD Loader.", "Sobre mostra Menu 1.00.", "Tudo o que veio das versões de desenvolvimento (0.x), descritas abaixo."]], ["NGCD 0.12 (menu 46 a 70) + MCU 00.12", "Pasta .media, .config no padrão ODE, topo como no 3DO e página leve.", ["Menu 70: paks como no 3DO — .media/covers/cover.pak (as 5 capas de cada jogo) e .media/screenshots/screenshots.pak. O menu abre o pak uma vez e lê cada imagem direto (sem procurar o arquivo numa pasta cheia); em Mídias → Cartão, Formato das capas e telas: PAK (padrão, nada solto) ou Individual (um arquivo por imagem); ao trocar, a página e o generate_usb convertem o que já está no cartão.", "Menu 70: Carrossel FX desliza como no 3DO: ao andar, cada capa vai da sua posição para a do vizinho, girando e mudando de tamanho. Deslize mais rápido (contas do processador mais rápidas e só o tamanho/posição muda a cada quadro), a capa grande do vizinho já fica na memória e a capa padrão também fica virada.", "Menu 70: letra D do botão de volta ao centro.", "Menu 70: Carrossel FX sem a faixa de outra capa embaixo do reflexo (no console) e com a barra do topo e o rodapé inteiros do lado direito.", "Menu 63: Carrossel FX não trava mais ao entrar (sem a covers96 no cartão, usa a capa de 64 direto).", "Menu 63: Vitrine e Faixa sem os pontinhos na descrição (sobra do brilho da estrela e de acentos do jogo anterior); Faixa sem meia capa por cima da capa padrão.", "Menu 63: botões do rodapé mais juntos (cabem na TV) e o D centralizado no botão.", "converter_tudo gera todos os tamanhos de capa (128, 96, 96 de 16 paletas, 64 e a capinha 24); o generate_usb copia as prontas.", "Menu 62: 3 exibições novas, como no 3DO (Opções → Aparência → Jogos → Exibição), num módulo à parte (XVIEW.PRG): Carrossel FX (capas dos lados viradas para o centro, em trapézio, com reflexo no chão), Vitrine (capa grande, ficha e a descrição inteira com rolagem) e Faixa (tela e dados em cima, fileira de capas embaixo).", "Menu 62: Carrossel com as capas de dentro maiores (96, entre a de fora e a do centro). Usam a capa nova .media/covers96 (96x96 com 16 paletas), que a página e o generate_usb criam sozinhos (também para as capas que já estão no cartão).", "Menu 62: rodapé de Jogos com C FAV e o botão SELECT (cápsula) FILTRO; SELECT ou START abrem o filtro. Caixas do filtro na largura do 3DO.", "Menu 61: tela do FILTRO igual à do 3DO — título JOGOS - FILTRO, duas caixas (Gênero e País) com caixinha [ ]/[X], barra de seleção na coluna ativa, gêneros e países em ordem alfabética, quantos jogos passam embaixo e os botões no rodapé (A MARCAR, B OK, C LIMPAR).", "Menu 61: Jogos - Lista com Vídeo: o jogo sem vídeo (e sem tela) mostra \"Sem vídeo\" em vez de \"Sem tela\".", "Menu 60: o menu em módulos, como no 3DO — Opções, Sobre, saves, drive de CD, Extrair ROM, WADs e o filtro ficam no XOPTS.PRG e só são lidos quando abrem. A memória fixa do menu ganhou ~68 KB livres (para os modos novos).", "Menu 60: A+B+C+D com START/SELECT não sai mais para o menu do SD Loader dentro do nosso menu (nos jogos, START+SELECT continua abrindo o menu do jogo).", "generate_usb refeito no esquema da página (.boot, .media e .config/ngcdgamelist.ode) e agora acerta os discos para o SD Loader: .chd (chdman), .nrg, .img+.ccd, .iso/.img/.bin sem .cue, .iso+mp3/ogg/flac (as faixas viram .wav), .zip/.7z, jogo solto na raiz e .cue com TAB.", "Menu 59: Opções → Console → Extrair ROM: o console copia o próprio BIOS (512 KB) e, ao voltar, o menu guarda em .roms (ex. frontload_japao.bin). Se já existir uma igual, não duplica.", "Menu 59: SELECT em Jogos (lista, capas e carrossel) abre o FILTRO, igual ao 3DO: Gênero e País, vários de cada; A marca, C limpa, B aplica. O título mostra (FILTRO).", "Menu 59: o medidor de tempo do CD fica na faixa de informações da lista de Jogos (no lugar dos dados do jogo), centralizado.", "Menu 59: a pasta dos WADs instalados agora é .wad (escondida, como .boot e .config); a antiga wad é movida sozinha.", "Página: copia o menu só para .boot (não mais para _BOOT). Com o loader antigo no console, avisa para atualizar.", "Página: a coluna mídias do ngcdgamelist.ode saía vazia quando as capas já estavam só na .media (o menu não mostrava as capas). Campo sem informação agora é \"-\" (para revisar); o menu 58 lê \"-\" como vazio.", "Menu 57: Atualizar o loader acha o .WAD da raiz mesmo com muitas pastas de jogos (a lista parava em 128 itens).", "Firmware NGCD 00.12 (loader novo): modo de segurança — segurando A, B, C ou D ao ligar, vai direto ao menu do SD Loader; na tela de aviso (sem .boot), A = menu do SD Loader e C = atualizar pelo .WAD da raiz.", "Menu 56 + firmware NGCD 00.12 (loader novo): o menu fica em .boot (padrão ODE); o loader procura .boot e, se não tiver, _BOOT. A página copia para .boot e só mantém o _BOOT enquanto o console estiver com o loader antigo.", "Menu 56: o WAD já instalado vai para a pasta wad (backup); Atualizar o loader lista os .WAD da raiz e da pasta wad para escolher.", "Menu 56: Sobre com Menu 0.56, Firmware do loader NGCD 00.12, MCU NGCD 00.12 e CPLD 00.03; o medidor de tempo só aparece na lista de Jogos.", "Menu 55: vídeo da lista sem travar — lê um pedaço por quadro (os mapas também) e começa assim que o 1º quadro chega.", "Menu 55: carrossel lê antes a capa grande dos vizinhos (fica na memória) e sem a faixa azul embaixo das capas das pontas.", "Menu 55: START+SELECT não abre o menu de cheats/reset do loader dentro do nosso menu (nos jogos continua).", "Menu 54: ngcdconfig.ode igual ao do 3DO (uma opção por linha, chave=valor) e ngcdgamelist.ode em texto (uma linha por jogo, TAB entre os campos) — dá para ler e editar no Bloco de Notas.", "Menu 54: vídeo da lista lido aos poucos (sem a demora e a lentidão); capas guardadas na memória e os vizinhos lidos com o controle parado.", "Menu 54: topo com a letra do tamanho da barra e o número um pouco mais à direita; Informações do SD Loader na ordem loader, MCU, CPLD e sem a barra.", "Menu 53: corrige o erro de endereço (ADDRESS ERROR) ao ligar do menu 52 — a leitura da lista de arquivos da raiz (para achar o .WAD).", "Menu 52: opções, favoritos, recentes e estatísticas em .config/ngcdconfig.ode, ngcdfavs.ode, ngcdrecent.ode e ngcdstats.ode (o _NGCCONFIG.SAV antigo é lido uma vez e fica guardado).", "Menu 52: lista de jogos (ano, gênero, país, título e descrição) em .config/ngcdgamelist.ode — sem a pasta texts e sem o MEDIA.PRG.", "Menu 52: o .WAD da raiz que já está instalado (MCU, CPLD e loader iguais) vira <loader>_MCU<versão>.BAK — o MCU não é regravado a cada ligada.", "Menu 52: topo com letra maior (5×7) e barras de 7 px; Sobre mostra MCU e CPLD certos já na primeira vez; carrossel com a moldura inteira e sem bico; Info do console sem a barra da memória de saves.", "Mídias na pasta .media do cartão (nome do jogo): o BOOT.ISO fica pequeno e não é mais montado pela página.", "A página só COPIA o boot/BOOT.ISO e o wad/*.WAD (o mais novo) da pasta do kit, e só quando mudaram — como no 3DO (seção ODE em Mídias).", "Gravar de novo não regrava o que já está no cartão; andamento por jogo (sem ficar parado em 0%).", "Topo da tela principal como no 3DO: logo no meio; SD (azul) e NVRAM (amarela) com letra pequena de contorno preto, barra com borda preta e o espaço livre logo depois.", "Opções novas (Aparência → Menu principal): Barra do SD, Barra da NVRAM e Bandeira (mostrar/esconder).", "Carrossel: moldura por fora da capa (os cantos não passam mais da borda) e tamanhos em degraus: 48 fora, 64 dentro, 128 no centro.", "Sobre lista as versões do menu, do loader, do MCU e do CPLD.", "Página: renomear na aba, botão de parar a música, enviar mídias para a biblioteca, lista que preenche a tela."]], ["NGCD 0.12 (menu 31 a 45) + loader NGC16 / MCU 00.12", "Caixa do jogo nova, fim dos riscos ao carregar e protetor de tela.", ["Opção Info dos jogos (Aparência → Mídias): Sobre a mídia (ano/país em cima, estrela/gênero embaixo) ou Abaixo da mídia (a caixa só com a imagem e os dados embaixo).", "Tela e vídeo voltam a 4:3 e a caixa acompanha o tamanho da imagem.", "Vezes jogado na barra de baixo, sob a posição na lista.", "Fim dos riscos pontilhados ao carregar capa, tela e vídeo: as cores só são gravadas enquanto a TV não desenha.", "A imagem anterior fica na caixa até a nova estar pronta (sem a caixa preta entre um jogo e outro).", "Capinha do Último jogo cabe no painel (sem regravar as mídias).", "Protetor de tela: volta a entrar e escurece/acende sem piscar.", "Transparência das faixas só aparece com Lista = Capa no modo Sobre a mídia.", "Agradecimentos com quebra de linha.", "Bandeira da região do console no topo direito da tela principal.", "Protetor de tela com os dois consoles e o logo passeando pela tela escura.", "Cedilha (ç) redesenhada.", "A opção Leitura silenciosa saiu do menu (fica sempre ligada).", "Vídeos convertidos com um pouco mais de nitidez (converta de novo para ver).", "Nova exibição Carrossel (Opções → Exibição): capa grande 128×128 no centro e duas de cada lado. Gere o cartão de novo para criar as capas grandes.", "Carrossel: capa padrão (CD do Neo Geo) quando o jogo não tem capa, no centro e nos lados.", "Carrossel: capa do centro troca sem piscar e as últimas capas vistas voltam na hora.", "Carrossel: a capa padrão deixou de aparecer com cores trocadas; a capa do centro tem prioridade ao carregar.", "Carrossel refeito: molduras e capas como sprites (z-order correto) — fim do contorno azul sobrando, da borda do centro comida e da capa de trás na frente.", "Suporte ao firmware novo do SD Loader (MCU 00.12): mostra o espaço do cartão SD. Com o MCU antigo, tudo igual."]], ["NGCD 0.12 (menu 30) + loader NGC16", "Capa, tela e vídeo com a mesma faixa; créditos.", ["Tela e vídeo passam a preencher a caixa (quadrado) e usam a MESMA faixa translúcida da capa (a Transparência vale para os três). Regrave o cartão para telas/vídeos novos.", "Ano, país e gênero centralizados na faixa, como a estrela.", "Créditos ao projeto NeoCDSDLoader (GPL-3.0), na página e no console."]], ["NGCD 0.12 (menu 25 a 29) + loader NGC15/16", "Ajustes do teste no console.", ["Loader NGC16: a tela \"sem cartão / sem BOOT\" voltou a ficar legível e saiu a opção do menu do SD Loader.", "Capinha do Último jogo dentro da moldura (24×24 — regrave o cartão).", "Dispositivo SD Loader: grupo INFORMAÇÕES com as informações do loader; FIRMWARE por último.", "Texto ao salvar: \"Salvando as opções...\". Estrela do favorito dentro da faixa.", "Página: selo de versão no topo; lista preenche a tela; Renomear só pelo .bat; usar um .ngi pronto como capa/tela."]], ["NGCD 0.12 (menu 24) + loader NGC14", "Leitura silenciosa (sem chuvisco) e telas trocadas num quadro só.", ["Leitura silenciosa: o cartão só é lido enquanto a TV não desenha (Opções → Dispositivo SD Loader → Avançado). Precisa do loader NGC14.", "Tudo o que o menu desenha aparece de uma vez, uma vez por quadro: sem a piscada amarela nos submenus e sem quadro azul.", "LED: opção Desligado (loader NGC14).", "\"Estatísticas\" cabe na caixa com folga dos dois lados."]], ["NGCD 0.12 (menu 23) + loader NGC13", "Sem piscadas: cada tela aparece inteira.", ["As telas novas são montadas por trás e aparecem de uma vez (submenus, idioma, voltar com B).", "Fim do chuvisco ao carregar capas/telas e das cores mudando no modo Capas.", "Tela principal: a quantidade de jogos só na caixa Jogos, na mesma fonte; caixas mais largas (\"Estatísticas\" não encosta mais).", "Faixas da capa translúcidas de verdade; ano e país no topo, gênero embaixo, estrela no meio.", "Descrição: a estrela só ao lado do nome.", "Opções: F vermelho no país de fábrica; Debug DIPs com cores (vermelho/verde/amarelo); Nome dos jogos abaixo de Lembrar a posição; Sobre mais limpo.", "Loader NGC13 (NGCD0013.WAD): sem cartão ou sem BOOT.ISO, aparece um aviso em vez do menu do SD Loader (A abre o menu do SD Loader).", "Chuvisco: os tiles só sobem enquanto a TV não desenha (confere linha a linha).", "Troca de tela grande: um quadro só com o fundo azul e a tela nova inteira (sem a faixa amarela).", "Dispositivo SD Loader abre e fecha por grupo, como a Aparência; o F também vale para Brasil.", "Sem capa: sem a faixa translúcida. A capinha do Último jogo fica dentro da borda.", "Página: a imagem escolhida (colada/arrastada) aparece na caixa da Capa/Tela."]], ["NGCD 0.12 (menu 22)", "Nome oficial dos jogos e cuidados com os nomes das pastas.", ["Opção Nome dos jogos: Título (o oficial da lista) ou Pasta; a lista fica em ordem do título.", "Procurar o jogo: clique no nome de um jogo sem capa e escolha o certo nas sugestões ou na busca; capa, tela, vídeo e texto vêm de uma vez (a pasta não muda; fica em _BOOT/LINKS.TXT).", "Só a imagem: para o jogo sem capa ou tela, escolha a imagem do libretro pela busca ou cole uma do Google Imagens.", "Página: volume da música em barra; Nome dos jogos logo abaixo de Lembrar a posição.", "Aviso quando o cartão tem mais de 200 jogos (o limite do SD Loader).", "Página: Passo a passo, Como usar, Novidades com todas as versões, Renomear pastas, aviso de nomes com mais de 25 letras, buscar o que falta pelo Verificar, ouvir a música do menu e prévia com a caixa CD."]], ["NGCD 0.12 (menu 21)", "Loader com o nosso nome, caixa CD e gerenciador de armazenamento.", ["Loader NGCD0012.WAD (aparece como NGC12); MCU 00.11 e CPLD 00.03 do NeoCDSDLoader.", "Nomes no padrão ODE: Armazenamento e Saves, Dispositivo SD Loader, Console Neo Geo CD.", "Gerenciador de armazenamento: console e cartão SD, copiar, restaurar e apagar saves.", "Caixa CD na tela principal, com o disco girando.", "Transparência das faixas (0 a 100%).", "Sobre e Agradecimentos; Manual na página."]], ["Menu 20", "Janela padrão e opções no _NGCCONFIG.SAV.", ["Pergunta, andamento e resultado numa janela só.", "Opções em _NGCCONFIG.SAV (o _NSDLMNU.SAV antigo é lido e apagado).", "Drive de CD, modo desenvolvedor, Debug DIPs, medidor de tempo do CD e região de fábrica.", "Toque rápido não se perde durante a leitura; capas mais limpas."]], ["Menu 19", "Correções do teste no console.", ["Jogos com o número em duas linhas; capinha do último jogo nova (28x28).", "Sem o chiado ao voltar e sem a faixa vermelha nas Capas.", "Opções: ordem, número de série, região do console; sem estalo ao mudar a música."]], ["Menu 18", "Caixa Jogos mais larga e sem o CD de espera.", ["A capa aparece direto, sem o CD antes.", "\"Sem capa\" e \"Sem tela\" na descrição."]], ["Menu 17", "Músicas de fundo e vídeo mais rápido.", ["10 músicas (ADPCM-A) com volume e Aleatória.", "O vídeo começa mais rápido e carrega aos pedaços."]], ["Menu 16", "Letras e capinha do último jogo.", ["Letras vale para o menu todo: Primeira maiúscula, MAIÚSCULAS, minúsculas.", "Capinha no painel Último jogo."]], ["Menu 15", "Modo Capas, música e opções em sanfona.", ["Exibição em grade de capas.", "Opções da Aparência abrem e fecham por grupo."]], ["Menu 14", "Descrição e gravação.", ["Margens da descrição do jogo; ◄► troca de jogo na descrição.", "Gravação do cartão pela página mais segura."]], ["Menu 13", "Menos piscadas e correções.", []], ["Menu 12", "Capas com brilho e aviso das artes.", []], ["Menu 11", "Vídeo sem piscar.", []], ["Menu 10", "Vídeo na lista.", ["Parado num jogo, a tela vira o vídeo (15 s)."]], ["Menu 9", "Sons, fundos de tela e faixas.", ["Efeitos sonoros, 9 fundos de tela, faixas de ano/país e estrela/gênero."]], ["Menu 8", "Três idiomas e dados dos jogos.", ["Português, espanhol e inglês.", "Ano, gênero, desenvolvedora e região de cada jogo (gamelist)."]], ["Menu 7", "Aparência completa e estrela do favorito.", ["16 arranjos da tela principal.", "Estrela com efeito ao favoritar; página igual à do menu."]], ["Menu 6", "Capas, telas e as ferramentas.", ["generate_usb.py e a página que grava o cartão."]], ["Menu 5", "Teste de controle, ajuste de imagem e acentos.", ["Informações do console e do SD Loader."]], ["Menu 4", "Favoritos, recentes e estatísticas.", ["O menu lembra o último jogo e quantas vezes cada um foi jogado."]], ["Menu 3", "Margens e animação das opções.", []], ["Menu 2", "Opções e saves.", ["Região, logo e LEDs do loader; guardar e carregar os saves no cartão."]], ["Menu 1", "A primeira versão do menu.", ["Tela principal, lista de jogos e a fonte do padrão ODE.", "O loader carrega o menu sozinho ao ligar (pasta .boot)."]]], "es": [["Menú 1.0 + firmware NGCD 00.12", "Primera versión pública.", ["Barras de la SD y de la NVRAM rediseñadas: nombre con sombra, carril oscuro y el espacio libre alineado a la derecha.", "Protector de pantalla como en 3DO: nuestro logo y cada consola, uno a la vez; cada 2 choques con el borde cambia. Los textos y las barras del menú ya no aparecen encima.", "El nombre largo se desplaza hasta el final: con el MCU NGCD 00.12 el menú lee el nombre entero de la carpeta (hasta 63 letras) y el título entero del gamelist.", "Portada por defecto con las esquinas redondeadas.", "Carrusel FX más fluido: lee antes las portadas hacia el lado al que avanzas, 2 pasos adelante.", "Unidad de CD: se quitó la opción Iniciar desde el CD (la caja CD del menú principal ya lo hace).", "Firmware: el loader aparece como NGCD 12 (NGCD 00.12) también en la pantalla del SD Loader.", "Acerca de muestra Menú 1.00.", "Todo lo de las versiones de desarrollo (0.x), abajo."]], ["NGCD 0.12 (menú 46 a 70) + MCU 00.12", "Carpeta .media, .config estándar ODE y parte de arriba como en 3DO.", ["Menú 70: paks como en 3DO: .media/covers/cover.pak y .media/screenshots/screenshots.pak (lectura directa, sin buscar en carpetas llenas). Opción Formato: PAK (por defecto) o Individual; al cambiar, se convierte lo que ya está en la tarjeta.", "Menú 70: Carrusel FX se desliza como en 3DO, más rápido; la portada por defecto también queda girada.", "Menú 70: Carrusel FX sin la franja de otra portada bajo el reflejo y con las barras enteras a la derecha.", "Menú 63: Carrusel FX ya no se cuelga al entrar (sin covers96 usa la portada de 64).", "Menú 63: Vitrina y Franja sin los puntitos en la descripción; Franja sin media portada sobre la portada por defecto.", "Menú 63: botones del pie más juntos y la D centrada.", "converter_tudo genera todos los tamaños de portada (128, 96, 96 de 16 paletas, 64 y la miniatura); generate_usb copia las listas.", "Menú 62: 3 vistas nuevas como en 3DO: Carrusel FX, Vitrina y Franja (módulo XVIEW.PRG).", "Menú 62: Carrusel con las portadas de dentro de 96 (.media/covers96).", "Menú 62: pie de Juegos con C FAV y SELECT FILTRO; SELECT o START abren el filtro.", "Menú 61: pantalla de FILTRO como en 3DO (casillas [ ]/[X], botones abajo: A MARCAR, B OK, C LIMPIAR).", "Menú 61: Lista con Vídeo muestra \"Sin vídeo\".", "Menú 60: menú en módulos como en 3DO (Opciones, saves, filtro... en XOPTS.PRG); ~68 KB libres.", "Menú 60: A+B+C+D con START/SELECT ya no sale al menú del SD Loader.", "generate_usb rehecho con el esquema de la página (.boot, .media, .config) y ahora prepara los discos: .chd, .nrg, .img+.ccd, .iso+mp3 (pistas a .wav), .zip/.7z.", "Menú 59: Opciones → Consola → Extraer ROM: guarda el BIOS de la consola en .roms (ej. frontload_japao.bin).", "Menú 59: SELECT en Juegos abre el FILTRO como en 3DO (Género y País; A marca, C limpia, B aplica).", "Menú 59: el medidor de tiempo del CD va en la banda de información de la lista, centrado.", "Menú 59: la carpeta de los WAD instalados ahora es .wad; la antigua wad se mueve sola.", "Página: copia el menú solo a .boot (ya no a _BOOT); con el loader antiguo, avisa para actualizar.", "Menú 52: opciones, favoritos, recientes y estadísticas en .config/ngcd*.ode; lista de juegos con descripciones en .config/ngcdgamelist.ode.", "Menú 52: el .WAD ya instalado pasa a .BAK; letra y barras más grandes arriba; carrusel con el marco entero.", "Medios en la carpeta .media de la tarjeta: el BOOT.ISO queda pequeño y la página ya no lo monta.", "La página solo COPIA boot/BOOT.ISO y wad/*.WAD (el más nuevo) de la carpeta del kit, y solo si cambiaron.", "Grabar de nuevo no regraba lo que ya está en la tarjeta.", "Parte de arriba como en 3DO: logo en el medio; SD (azul) y NVRAM (amarilla) con letra pequeña con borde negro.", "Opciones nuevas: Barra de la SD, Barra de la NVRAM y Bandera (mostrar/ocultar).", "Carrusel: marco por fuera de la portada y tamaños escalonados (48, 64, 128)."]], ["NGCD 0.12 (menú 31 a 45) + loader NGC16 / MCU 00.12", "Caja del juego nueva, sin rayas al cargar y protector de pantalla.", ["Opción Info de los juegos: Sobre la imagen o Debajo de la imagen.", "Pantalla y vídeo vuelven a 4:3; la caja sigue el tamaño de la imagen.", "Veces jugado en la barra de abajo.", "Sin rayas punteadas al cargar portada, pantalla y vídeo.", "La imagen anterior queda en la caja hasta que la nueva esté lista.", "Protector de pantalla corregido; Agradecimientos con salto de línea.", "Bandera de la región en la pantalla principal.", "Protector de pantalla con las dos consolas y el logo.", "Cedilla (ç) redibujada; sin la opción Lectura silenciosa (siempre activa).", "Nueva vista Carrusel: portada grande 128×128 en el centro y dos a cada lado (genera la tarjeta de nuevo).", "Carrusel: portada por defecto cuando el juego no tiene portada; la del centro cambia sin parpadeo.", "Carrusel: la portada por defecto ya no sale con colores cambiados; la del centro carga primero.", "Carrusel rehecho: marcos y portadas como sprites, orden de profundidad correcto.", "Soporte al firmware nuevo (MCU 00.12): muestra el espacio de la tarjeta SD."]], ["NGCD 0.12 (menú 30) + loader NGC16", "Portada, pantalla y vídeo con la misma banda.", ["Pantalla y vídeo llenan la caja (cuadrado) con la MISMA banda translúcida de la portada. Graba la tarjeta de nuevo.", "Año, país y género centrados en la banda, como la estrella.", "Créditos al proyecto NeoCDSDLoader (GPL-3.0)."]], ["NGCD 0.12 (menú 25 a 29) + loader NGC15/16", "Ajustes de la prueba en consola.", ["Loader NGC16: la pantalla sin tarjeta/BOOT volvió a ser legible.", "Miniatura del último juego dentro del marco (24×24).", "Dispositivo SD Loader: grupo INFORMACIÓN; FIRMWARE al final.", "Página: sello de versión; lista llena la pantalla; Renombrar solo por .bat."]], ["NGCD 0.12 (menú 24) + loader NGC14", "Lectura silenciosa (sin lluvia) y pantallas cambiadas en un solo cuadro.", ["Lectura silenciosa: la tarjeta solo se lee mientras la TV no dibuja. Requiere el loader NGC14.", "Todo lo que el menú dibuja aparece de una vez.", "LED: opción Apagado."]], ["NGCD 0.12 (menú 23) + loader NGC13", "Sin parpadeos: cada pantalla aparece entera.", ["Las pantallas se montan por detrás y aparecen de una vez.", "Sin lluvia al cargar portadas y sin colores cambiando en Portadas.", "Pantalla principal: la cantidad de juegos solo en la caja Juegos; cajas más anchas.", "Bandas de la portada translúcidas de verdad.", "Loader NGC13: sin tarjeta o sin BOOT.ISO aparece un aviso (A abre el menú del SD Loader).", "Lluvia: los tiles solo suben mientras la TV no dibuja.", "Dispositivo SD Loader abre y cierra por grupo.", "Página: la imagen elegida aparece en la caja de Portada/Pantalla."]], ["NGCD 0.12 (menu 22)", "Nombre oficial de los juegos y cuidado con los nombres de carpeta.", ["Opción Nombre de los juegos: Título (el oficial) o Carpeta; la lista sigue el título.", "Buscar el juego: haz clic en un juego sin portada y elige el correcto en las sugerencias o la búsqueda; portada, pantalla, video y texto de una vez.", "Solo la imagen: elige una portada o pantalla de libretro o pega una de Google Imágenes.", "Página: volumen en barra; Nombre de los juegos debajo de Recordar la posición.", "Aviso con más de 200 juegos (límite del SD Loader).", "Página: Paso a paso, Cómo usar, Novedades, Renombrar carpetas, aviso de nombres de más de 25 letras, buscar lo que falta, oír la música del menú."]], ["NGCD 0.12 (menu 21)", "Loader con nuestro nombre, caja CD y gestor de almacenamiento.", ["Loader NGCD0012.WAD (NGC12); MCU 00.11 y CPLD 00.03 de NeoCDSDLoader.", "Nombres con el estándar ODE.", "Gestor de almacenamiento: consola y tarjeta SD.", "Caja CD con el disco girando.", "Transparencia de las bandas.", "Acerca de, Agradecimientos y Manual."]], ["Menu 20", "Ventana estándar y opciones en _NGCCONFIG.SAV.", ["Pregunta, progreso y resultado en una ventana.", "Unidad de CD, modo desarrollador, Debug DIPs, medidor de tiempo."]], ["Menu 19", "Correcciones de la prueba en consola.", ["Miniatura del último juego nueva; sin ruido al volver."]], ["Menu 18", "Caja Juegos más ancha y sin el CD de espera.", []], ["Menu 17", "Música de fondo y video más rápido.", []], ["Menu 16", "Letras y miniatura del último juego.", []], ["Menu 15", "Modo Portadas y opciones en acordeón.", []], ["Menu 14", "Descripción y grabación.", []], ["Menu 13", "Menos parpadeos y correcciones.", []], ["Menu 12", "Portadas con brillo.", []], ["Menu 11", "Video sin parpadeo.", []], ["Menu 10", "Video en la lista.", []], ["Menu 9", "Sonidos, fondos y bandas.", []], ["Menu 8", "Tres idiomas y datos de los juegos.", []], ["Menu 7", "Apariencia completa y estrella de favorito.", []], ["Menu 6", "Portadas, pantallas y herramientas.", []], ["Menu 5", "Prueba de control y ajuste de imagen.", []], ["Menu 4", "Favoritos, recientes y estadísticas.", []], ["Menu 3", "Márgenes y animación de opciones.", []], ["Menu 2", "Opciones y partidas.", []], ["Menu 1", "Primera versión del menú.", []]], "en": [["Menu 1.0 + NGCD 00.12 firmware", "First public release.", ["SD and NVRAM bars redesigned: name with a drop shadow, dark track and free space right-aligned with tighter letters.", "3DO-style screen saver: our logo and each console, one at a time; every 2 edge bounces it changes. The menu texts and bars no longer show on top.", "Long names scroll to the end: with MCU NGCD 00.12 the menu reads the whole folder name (up to 63 letters) and the whole gamelist title.", "Default cover with rounded corners, like real covers.", "Smoother Carousel FX: covers are read ahead in the direction you are moving, 2 steps ahead.", "CD drive: the Boot from the CD drive option was removed (the CD box on the main menu does it).", "Firmware: the loader shows as NGCD 12 (NGCD 00.12) on the SD Loader screen too.", "About shows Menu 1.00.", "Everything from the development versions (0.x), listed below."]], ["NGCD 0.12 (menu 46 to 70) + MCU 00.12", ".media folder, ODE-standard .config and 3DO-style top bar.", ["Menu 70: 3DO-style paks: .media/covers/cover.pak and .media/screenshots/screenshots.pak (direct reads, no searching crowded folders). Format option: PAK (default) or Individual; switching converts what is already on the card.", "Menu 70: Carousel FX slides like the 3DO, faster; the default cover is tilted too.", "Menu 70: Carousel FX without the stray strip under the reflection and with the bars whole on the right.", "Menu 63: Carousel FX no longer freezes on entry (without covers96 it uses the 64 cover).", "Menu 63: Showcase and Strip without stray dots in the description; Strip without half a cover over the default cover.", "Menu 63: footer buttons closer together and the D centered.", "converter_tudo makes every cover size (128, 96, 96 with 16 palettes, 64 and the 24 thumbnail); generate_usb copies the ready ones.", "Menu 62: 3 new views like the 3DO: Carousel FX, Showcase and Strip (XVIEW.PRG module).", "Menu 62: Carousel inner covers at 96 px (.media/covers96).", "Menu 62: Games footer with C FAV and SELECT FILTER; SELECT or START open the filter.", "Menu 61: FILTER screen like the 3DO (checkboxes [ ]/[X], buttons in the footer: A MARK, B OK, C CLEAR).", "Menu 61: List with Video shows \"No video\".", "Menu 60: modular menu like the 3DO (Options, saves, filter... in XOPTS.PRG); ~68 KB freed.", "Menu 60: A+B+C+D with START/SELECT no longer exits to the SD Loader menu.", "generate_usb rebuilt on the page's layout (.boot, .media, .config) and now prepares the discs: .chd, .nrg, .img+.ccd, .iso+mp3 (tracks to .wav), .zip/.7z.", "Menu 59: Options → Console → Dump ROM: saves the console BIOS to .roms (e.g. frontload_japao.bin).", "Menu 59: SELECT in Games opens the FILTER like the 3DO (Genre and Country; A marks, C clears, B applies).", "Menu 59: the CD timing meter sits in the list's info strip, centered.", "Menu 59: installed WADs now go to the .wad folder; the old wad folder is moved automatically.", "Page: copies the menu only to .boot (no longer _BOOT); with the old loader it warns you to update.", "Menu 52: options, favorites, recents and stats in .config/ngcd*.ode; game list with descriptions in .config/ngcdgamelist.ode.", "Menu 52: an already-installed .WAD becomes .BAK; bigger top text and bars; carousel frame whole.", "Media in the card's .media folder: BOOT.ISO stays small and the page no longer builds it.", "The page only COPIES boot/BOOT.ISO and wad/*.WAD (the newest) from the kit folder, and only when they changed.", "Writing again does not rewrite what is already on the card.", "3DO-style top bar: logo in the middle; SD (blue) and NVRAM (yellow) with small black-outlined text and bordered bars.", "New options: SD bar, NVRAM bar and Flag (show/hide).", "Carousel: frame outside the cover and stepped sizes (48, 64, 128)."]], ["NGCD 0.12 (menu 31 to 45) + loader NGC16 / MCU 00.12", "New game box, no more lines while loading, screen saver.", ["Game info option: Over the media or Below the media.", "Screen and video are 4:3 again; the box follows the image size.", "Play count in the bottom bar.", "No more dotted lines when loading cover, screen and video.", "The previous image stays in the box until the new one is ready.", "Screen saver fixed; Thanks screen with line breaks.", "Console region flag on the main screen.", "Screen saver with both consoles and the logo.", "Cedilla (ç) redrawn; Quiet reading option removed (always on).", "New Carousel view: large 128×128 cover in the centre and two on each side (generate the card again).", "Carousel: default cover when a game has none; the centre cover swaps without flicker.", "Carousel: the default cover no longer shows wrong colors; the centre cover loads first.", "Carousel redone: frames and covers as sprites with correct depth order.", "Support for the new SD Loader firmware (MCU 00.12): shows SD card space."]], ["NGCD 0.12 (menu 30) + loader NGC16", "Cover, screen and video share the same band.", ["Screen and video now fill the box (square) with the SAME translucent band as the cover. Write the card again.", "Year, country and genre centered in the band, like the star.", "Credits to the NeoCDSDLoader project (GPL-3.0)."]], ["NGCD 0.12 (menu 25 to 29) + loader NGC15/16", "Fixes from the console test.", ["Loader NGC16: the no-card/no-BOOT screen is readable again.", "Last-game thumbnail inside the frame (24×24).", "SD Loader device: INFORMATION group; FIRMWARE last.", "Page: version badge; list fills the screen; Rename via .bat only."]], ["NGCD 0.12 (menu 24) + loader NGC14", "Quiet reading (no noise) and screens swapped in a single frame.", ["Quiet reading: the card is only read while the TV is not drawing. Needs loader NGC14.", "Everything the menu draws shows at once.", "LED: Off option."]], ["NGCD 0. /* O arquivo do menu: _NGCCONFIG.SAV (MENU 20+; o MCU só lê .SAV da raiz); o antigo _NSDLMNU.SAV é lido e apagado */
const CFG_FILE = "_NGCCONFIG.SAV", CFG_OLD = "_NSDLMNU.SAV";
async function readSav(){
  try { const v = await readOde(); if (v) return v; } catch(e){}      /* menu 52+: .config/ngcd*.ode */
  for (const n of [CFG_FILE, CFG_OLD]){ try { const v = parseSav((await readFile([], n)).buffer); if (v) return v; } catch(e){} }
  return null;
}
/* ---------------- .config/ngcd*.ode (menu 52+, padrão ODE como o 3DO) ----------------
 * ngcdconfig.ode: "NGCD ODE CONFIG 1", "opts=<64 hex>", "last=<pasta>"; ngcdfavs.ode / ngcdrecent.ode: uma pasta por linha;
 * ngcdstats.ode: "<vezes>\t<pasta>". Aqui viram o mesmo {opts, rest} do .SAV para o resto da página. */
const ODE_DIR = ".config";
async function odeText(n, enc = "latin1"){ try { return new TextDecoder(enc).decode(await readFile([ODE_DIR], n)); } catch(e){ return null; } }
/* ngcdconfig.ode como o 3doconfig.ode: "#NGCD-ODE-CONFIG#", "chave=valor" por linha (as chaves do SECS; os bytes que
   não estão nas Opções da página vão como número), "last=", "#END#". O mesmo cfgkeys.h no menu. */
const ODE_EXTRA = [[18, "avancado_dip1"], [19, "avancado_dip2"], [20, "avancado_dev"], [23, "avancado_medidor"], [25, "interno_25"], [26, "midia_info"], [27, "interno_27"], [31, "interno_31"]];
function odeKeys(){ return ALL_ITEMS.map(([, vals, key, byte]) => [byte, key, vals]).concat(ODE_EXTRA.map(([b, k]) => [b, k, null])).sort((a, b) => a[0] - b[0]); }
async function readOde(){
  const c = await odeText("ngcdconfig.ode", "utf-8"); if (!c || !/^(#NGCD-ODE-CONFIG#|NGCD ODE CONFIG)/.test(c)) return null;
  const opts = new Uint8Array(CFG_OPT), rest = new Uint8Array(CFG_REST), dv = new DataView(rest.buffer);
  let loader = 0;
  const lines = t => (t || "").split(/\r?\n/).filter(Boolean), keys = new Map(odeKeys().map(k => [k[1], k]));
  for (const l of lines(c)){
    if (l.startsWith("#END#")) break;
    const e = l.indexOf("="); if (l[0] === "#" || e < 0) continue;
    const k = l.slice(0, e), val = l.slice(e + 1);
    if (k === "opts" && val.length >= CFG_OPT * 2) for (let i = 0; i < CFG_OPT; i++) opts[i] = parseInt(val.substr(2 * i, 2), 16) || 0;   /* menus 52/53 */
    else if (k === "last") rest.set(latin1(val).subarray(0, 31), 0);
    else if (k === "info_loader") loader = parseInt(val) || 0;     /* o menu grava qual loader está no console */

async function openCard(demo){
  S.demo = demo; S.links = new Map(); S.own = {covers:new Map(), screenshots:new Map()}; S.ownVid = new Map(); S.ownBoot = null; S.ownWads = []; S.picked = new Set(); S.mediaVid = new Map(); S.sav = null; S.cfg = cfgDefaults(); S.cfgTouched = false; S.bootVer = ""; S.myTxt = loadMyTxt(); R.edit = {}; R.check = {}; R.all = false; R.files = false;
  if (demo){ S.root = null; S.rootName = "DEMO"; S.games = DEMO_GAMES.slice(); for (const k in KINDS){ S.card[k] = new Map(); S.cardImg[k] = new Map(); } S.card.covers.set(norm("Metal Slug"), {name:"Metal Slug.ngi"}); }
  else {
    S.root = await window.showDirectoryPicker({mode:"readwrite"}); S.rootName = S.root.name || "SD";
    S.games = (await scan(S.root)).sort((a, b) => a.localeCompare(b, undefined, {sensitivity:"base"}));
    await readCard();
    S.sav = await readSav();
    for (const bd of BOOT_DIRS){ try { parseLinks(new TextDecoder().decode(await readFile([bd], "LINKS.TXT"))); break; } catch(e){} }
    if (S.sav) S.cfg = cfgFromOpts(S.sav.opts, S.sav.ver < 3);
    for (const bd of BOOT_DIRS){ try { const iso = await readFile([bd], "BOOT.ISO"); const s = new TextDecoder("latin1").decode(iso.subarray(0, Math.min(iso.length, 400000))); const m = s.match(/MENU (\d+)/); S.bootVer = m ? m[1] : "?"; break; } catch(e){} }
  }
  S.sel = 0; S.filter = "all"; coverCache.clear();
  await loadLibrary();
  S.glLang = ""; await loadTexts(); candCache = null;
}
async function openOwn(){
  const dir = await window.showDirectoryPicker({mode:"read"}); S.ownVid = new Map(); S.ownBig = new Map(); S.ownMid = new Map(); S.ownBoot = null; S.ownWads = []; menuFiles = null;
  async function walk(d, kind, depth){
    for await (const [n, h] of d.entries()){
      if (n.startsWith(".")) continue;
      if (h.kind === "directory"){ const ln = n.toLowerCase(); if ((kind === "wad" || kind === "boot") && (ln === "versions" || ln === "source")) continue;   /* backups do kit: nao copia */
        const k = ln === "covers128" ? "big" : ln === "covers96" ? "mid" : (ln === "boot" || ln === "_boot") ? "boot" : (ln === "wad" || ln === "wads") ? "wad" : Object.keys(KINDS).find(x => KINDS[x].dirs.includes(ln)); if (depth < 3) await walk(h, k || kind, depth + 1); continue; }
      /* ODE (como o 3DO): o menu pronto em boot/ e o firmware em wad/, na mesma pasta das mídias */
      if ((kind === "boot" || depth === 0) && /^boot\.(iso|cue)$/i.test(n)){ try { S.ownBoot = S.ownBoot || {}; S.ownBoot[/iso$/i.test(n) ? "iso" : "cue"] = await h.getFile(); } catch(e){} continue; }
      if ((kind === "wad" || depth === 0) && /\.wad$/i.test(n)){ try { S.ownWads.push(await h.getFile()); } catch(e){} continue; }
      if (kind === "big"){ if (/\.ngi$/i.test(n) && !S.ownBig.has(norm(n))) try { S.ownBig.set(norm(n), await h.getFile()); } catch(e){} continue; }
      if (kind === "mid"){ if (/\.ngi$/i.test(n) && !S.ownMid.has(norm(n))) try { S.ownMid.set(norm(n), await h.getFile()); } catch(e){} continue; }   /* media\covers96 do converter_tudo */   /* media\covers128 do converter_tudo: capas grandes prontas */
      /* guarda o File (não o handle): createObjectURL só aceita Blob/File, e getFile() aqui é barato (não lê os bytes) */
      if (/\.ngv$/i.test(n)){ if (!S.ownVid.has(norm(n))) try { S.ownVid.set(norm(n), await h.getFile()); } catch(e){} continue; }
      if (IMG.test(n) || /\.ngi$/i.test(n)){ const k = kind || "covers"; if (!S.own[k].has(norm(n))) try { S.own[k].set(norm(n), await h.getFile()); } catch(e){} }
    }
  }
  await walk(dir, null, 0); coverCache.clear();
  if (S.ownBoot && S.ownBoot.iso){ try { S.ownBoot.bytes = new Uint8Array(await S.ownBoot.iso.arrayBuffer()); S.ownBoot.ver = bootVerOf(S.ownBoot.bytes); } catch(e){ S.ownBoot = null; } }
}
/* O vídeo (.ngv) do jogo: o do cartão (videos/), senão o da nossa biblioteca. A página não converte mp4: use o converter_tudo/generate_usb. */
async function ngvOf(g){
  const k = norm(g);
  try {
    if (mhas(S.ownVid, g)){       /* da sua pasta (media\videos do converter_tudo): vai também para videos/ do cartão */
      const h = mget(S.ownVid, g), d = new Uint8Array(await (h.getFile ? await h.getFile() : h).arrayBuffer());
      if (ngvOk(d)){ if (!S.o.media_out) await put(["videos"], g + ".ngv", d); return d; }
    }
    if (mhas(S.cardVid, g)) return new Uint8Array(await (await mget(S.cardVid, g).getFile()).arrayBuffer());
    if (mhas(S.libVid, g)){
      const d = new Uint8Array(await (await get(BASE + CFG.video + encodeURIComponent(mget(S.libVid, g)) + ".ngv")).arrayBuffer());
      if (ngvOk(d)){ if (!S.o.media_out) await put(["videos"], g + ".ngv", d); return d; }
    }
  } catch(e){}
  return null;
}
/* Os bytes do .ngi do jogo g, de onde estiver (convertendo se for imagem). */
async function ngiOf(g, kind){
  const st = status(g, kind), k = norm(g), K = KINDS[kind];
  if (st === "card"){ const c = mget(S.card[kind], g);
    if (!c.dir){ const f = await mediaImg(kind === "covers" ? "covers_full" : "screenshots", c.name.replace(/\.ngi$/i, "")); if (f) return f; throw new Error("pak"); }
    return new Uint8Array(await (await (await c.dir.getFileHandle(c.name)).getFile()).arrayBuffer()); }
  if (st === "own"){ const h = mget(S.own[kind], g), f = h.getFile ? await h.getFile() : h;
    if (/\.ngi$/i.test(f.name || "")){ const b = new Uint8Array(await f.arrayBuffer()); if (b[0] === 0x4E && b[1] === 0x47 && b[2] === 0x49) return b; }   /* já é .ngi pronto: usa os bytes direto */
    return await toNgi(f, K.kind); }
  if (st === "img") return await toNgi(await mget(S.cardImg[kind], g).getFile(), K.kind);
  if (st === "lib") return new Uint8Array(await (await get(BASE + CFG[K.lib] + encodeURIComponent(mget(S.lib[kind], g)) + ".ngi")).arrayBuffer());
  if (st === "retro") return await toNgi(await (await get(RETRO + K.retro + "/" + encodeURIComponent(mget(S.retro[kind], g)) + ".png")).blob(), K.kind);
  return null;
}

/* ---------------- Capa e tela do jogo selecionado (como ficam no console) ---------------- */
const coverCache = new Map();
async function previewOf(g, kind){
  const key = kind + "|" + norm(g) + "|" + status(g, kind);
  if (coverCache.has(key)) return coverCache.get(key);
  let res = null;
  try { if (!S.demo){ const d = await ngiOf(g, kind); if (ngiOk(d)) res = ngiImage(d); } } catch(e){}
  coverCache.set(key, res);
  return res;
}

/* As teclas do rodapé com as cores dos botões do Neo Geo (A vermelho, B amarelo, C verde, D azul). */
function keys(list){
  wizBar();
  if (S.wiz > 0 && !["home","help","manual"].includes(S.screen))
    list = [["wback","B",t("k_back")],["wquit","D",t("w_quit")],"gap"].concat(S.wiz < WIZ.length ? [["wnext","A",t("w_next"), S.wiz === 1 && !ready()]] : []);
  $("keys").innerHTML = list.map(k => k === "gap" ? '<span class="gap"></span>' :
    `<button class="key" data-k="${k[0]}" ${k[3] ? "disabled" : ""}><i class="${k[1] === "START" || k[1] === "SELECT" ? "S" : k[1] === "?" ? "Q" : k[1]}">${k[1]}</i>${esc(k[2])}</button>`).join("");
}
function go(screen){ if (screen !== "options") musicStop(); if (screen === "home") S.wiz = 0; S.screen = screen; draw(); window.scrollTo({top:0}); }
function draw(){
  document.documentElement.lang = lang;
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  drawVers();
  $("foot").textContent = t("foot");
  document.title = "Neo Geo CD SD Loader — " + t("title");
  ({home:drawHome, games:drawGames, media:drawMedia, options:drawOptions, write:drawWrite, check:drawCheck, manual:drawManual, help:drawHelp, wcard:drawWcard, rename:drawRename})[S.screen]();
}
const ready = () => S.games.length > 0;
const noFS = !window.showDirectoryPicker;

function drawHome(){
  $("title").textContent = t("title");
  const dis = ready() ? "" : "disabled", m = ready() ? missing() : null;
  let last;
  if (!S.root && !S.demo) last = `<div class="disc"></div><div><div class="l1">${esc(t("l_none"))}</div><b>${esc(t("l_none2"))}</b></div>`;
  else if (!ready()) last = `<div class="disc"></div><div><div class="l1">${esc(t("l_card"))}: ${esc(S.rootName)}</div><b>${esc(t("none"))}</b></div>`;
  else {
    const parts = [[m.covers,"cov"],[m.screenshots,"shot"]].filter(x => x[0]).map(x => `${t(x[1]).toLowerCase()} ${x[0]}`);
    last = `<div class="disc"></div><div><div class="l1">${esc(t("l_card"))}: ${esc(S.rootName)}</div><b>${esc(t("n_games")(S.games.length))}</b>
      <div class="l3">${esc(S.demo ? t("l_demo") : parts.length ? t("l_missing") + ": " + parts.join(" · ") : t("l_all"))}</div></div>`;
  }
  $("view").innerHTML = (noFS ? `<div class="warn"><b>${esc(t("nofs_t"))}</b><br>${esc(t("nofs_b"))}</div>` : "") + `
    <div class="home">
      <button class="tile t-gold" data-go="pick" ${noFS ? "disabled" : ""}>${ICON.card}<span>${esc(t("t_card"))}</span><small>${esc(t("t_card_s"))}</small></button>
      <button class="tile t-wiz ${ready() ? "" : "sel"}" data-go="wiz" ${noFS ? "disabled" : ""}><i class="cd"></i><span>${esc(t("t_wiz"))}</span><small>${esc(t("t_wiz_s"))}</small></button>
      <button class="tile t-blue ${ready() ? "sel" : ""}" data-go="games" ${dis}><img class="pad" src="${PAD}" alt=""><span>${esc(t("t_games"))}${ready() ? " - " + S.games.length : ""}</span></button>
      <button class="tile t-green" data-go="write" ${dis}>${ICON.write}<span>${esc(t("t_write"))}</span><small>${esc(t("t_write_s"))}</small></button>
      <button class="tile t-red" data-go="media" ${dis}>${ICON.media}<span>${esc(t("t_media"))}</span><small>${esc(t("t_media_s"))}</small></button>
      <button class="tile t-gray" data-go="options" ${dis}>${ICON.gear}<span>${esc(t("t_opts"))}</span><small>${esc(t("t_opts_s"))}</small></button>
    </div>
    <div class="last">${last}</div>
    <div class="tip"><i></i><div><b>${esc(t("tip_t"))}</b><br>${esc(t("tip_b"))}
      <div class="tipk">${[["tip_c", TIP_ICON.cover], ["tip_s", TIP_ICON.screen], ["tip_v", TIP_ICON.video]].map(([k, ic]) =>
        `<div><span>${ic}</span><p><b>${esc(t(k)[0])}</b> ${esc(t(k)[1])}</p></div>`).join("")}</div></div></div>` + newsBox();
  keys([["pick","A",t("k_pick"),noFS],["demo","D",t("k_demo")],["check","C",t("k_check"),!ready()],["help","?",t("k_help")],"gap",["write","START",t("t_write"),!ready()]]);
}

/* Novidades: a versão atual aberta com "Mais"; as anteriores embaixo (o changelog) */
function newsBox(){
  const n = t("news"), [v, sub, items] = n[0];
  return `<div class="news"><div>
    <div class="nh"><b>${esc(t("n_t"))} — ${esc(v)}</b><button data-news="1">${esc(t(S.news ? "n_less" : "n_more"))} ${S.news ? "▴" : "▾"}</button></div>
    ${esc(sub)}
    ${S.news ? `<ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` +
      `<b>${esc(t("n_old"))}</b><ul>` + n.slice(1).map(([v2, s2, it2]) => `<li><b>${esc(v2)}</b> — ${esc(s2)}${it2.length ? `<ul>${it2.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</li>`).join("") + `</ul>` : ""}
  </div></div>`;
}

/* Passo a passo: Cartão, Jogos, Mídias, Opções, Gravar (como o 3DO) */
const WIZ = [["wcard","t_card"],["games","t_games"],["media","t_media"],["options","t_opts"],["write","t_write"]];
function wizBar(){
  const w = $("wiz"), on = S.wiz > 0 && !["home","help","manual"].includes(S.screen);
  w.hidden = !on; if (!on) return;
  const d = {2:"w_games_d", 4:"w_opts_d"}[S.wiz];
  w.innerHTML = `<div class="wsteps"><b>${esc(t("w_step")(S.wiz, WIZ.length))}</b>` +
    WIZ.map((x, i) => `<span class="${i + 1 === S.wiz ? "on" : i + 1 < S.wiz ? "ok" : ""}"><i>${i + 1}</i>${esc(t(x[1]))}</span>`).join("") + `</div>` +
    (d ? `<p class="note">${esc(t(d))}</p>` : "");
}
function wizGo(n){
  if (n < 1 || n > WIZ.length){ S.wiz = 0; return go("home"); }
  if (n > 1 && !ready()) n = 1;
  S.wiz = n;
  go(WIZ[n - 1][0]);
}
function drawWcard(){
  $("title").textContent = t("s_wcard");
  $("view").innerHTML = (noFS ? `<div class="warn"><b>${esc(t("nofs_t"))}</b><br>${esc(t("nofs_b"))}</div>` : "") + `<p class="note">${esc(t("w_card_d"))}</p>
    <button class="big" data-go="wpick" ${noFS ? "disabled" : ""}>${esc(t("k_pick"))}</button> <button class="big stop" data-go="wdemo">${esc(t("k_demo"))}</button>
    ${ready() ? `<div class="last" style="margin-top:14px"><div class="disc"></div><div><div class="l1">${esc(t("l_card"))}: ${esc(S.rootName)}</div><b>${esc(t("n_games")(S.games.length))}</b></div></div>` : ""}`;
  keys([]);
}

/* Como usar: os cinco passos, na ordem do Passo a passo */
function drawHelp(){
  $("title").textContent = t("s_help");

/* Favoritos e vezes jogado do arquivo do menu (para a lista mostrar a estrela, como no console). */
function recOf(g){
  if (!S.sav) return null;
  const r = S.sav.rest, dv = new DataView(r.buffer, r.byteOffset), n = Math.min(120, dv.getUint16(32)), want = latin1(g).subarray(0, 25);
  for (let i = 0; i < n; i++){
    const o = 34 + i * 32; let ok = true;
    for (let k = 0; k < 26; k++){ const a = r[o + k], b = k < want.length ? want[k] : 0; if (a !== b){ ok = false; break; } if (!a) break; }
    if (ok) return {plays:dv.getUint16(o + 26), fav:r[o + 28], recent:r[o + 29]};
  }
  return null;
}

/* ---------------- Renomear as pastas dos jogos pelo nome oficial (como o 3DO 1.6) ----------------
 * Só pelo título (a nossa lista tem os nomes da Redump, sem as somas; e o formato do NeoCDSDLoader, .iso + .wav, nunca bate com
 * as somas): tudo é "confira antes". Pasta com mais de 25 letras: o SD Loader mostra só o começo, então o nome
 * proposto fica sem as etiquetas ( ) quando passa. Os favoritos e as estatísticas (_NGCCONFIG.SAV) vão junto. */
const R = {state:"list", items:[], msg:"", edit:{}, check:{}, all:false, files:false};
function folderSafe(n){ return n.replace(/[\\/:*?"<>|]/g, " - ").replace(/\s+/g, " ").replace(/[ .]+$/, "").trim(); }
const discOf = s => { const m = String(s).match(/\b(?:disc|disco|cd)\s*0*([0-9]+)/i); return m ? m[1] : ""; };
/* Parecido entre dois nomes (pares de letras em comum, 0..1); os números têm de ser os mesmos (KOF 94 ≠ KOF 95) */
const ROMAN = {ii:2, iii:3, iv:4, v:5, vi:6, vii:7, viii:8, ix:9, x:10};
const deRoman = x => x.replace(/\b(ii|iii|iv|vi{0,3}|ix|x)\b/gi, r => ROMAN[r.toLowerCase()] || r);
function similar(a, b){
  const A = norm(deRoman(a)), B = norm(deRoman(b));
  if ((A.match(/\d+/g) || []).join(",") !== (B.match(/\d+/g) || []).join(",")) return 0;
  const pairs = x => { const m = new Map(); for (let i = 0; i < x.length - 1; i++){ const k = x.slice(i, i + 2); m.set(k, (m.get(k) || 0) + 1); } return m; };
  const pa = pairs(A), pb = pairs(B); let common = 0;
  for (const [k, n] of pa) common += Math.min(n, pb.get(k) || 0);
  return 2 * common / Math.max(1, A.length + B.length - 2);
}
function renameScan(){
  /* Só as pastas que NÃO casam com a lista oficial (sem textos e sem mídias da biblioteca): para cada uma, o título
     oficial mais parecido. As que já casam funcionam como estão e não são tocadas. */
  const taken = new Map(S.games.map(g => [g.toLowerCase(), g]));
  R.items = []; R.msg = "";
  const names = [...new Set(S.dat)].filter(Boolean);     /* nomes OFICIAIS COMPLETOS do redump, com regiao */
  for (const g of S.games){
    const matched = !!gameInfo(g).title;
    const gl = g.toLowerCase();
    const hint = nm => (String(nm).toLowerCase().match(/\((usa|japan|europe|world)[^)]*\)/g) || []).some(r => gl.includes(r.replace(/[()]/g, "")));
    const gd = discOf(g);                               /* nº do disco que a pasta indica (Disc/CD/Disco N) */
    const lk = linkOf(g);                               /* ligado à mão no 🔗 (título, sem região) */
    let best = null, bs = 0, tag;
    if (lk){
      const lkn = norm(displayTitle(lk));               /* o nome oficial COMPLETO (com região) que bate com o vínculo */
      for (const nm of names){ if (norm(displayTitle(nm)) !== lkn) continue; const dd = discOf(nm); const v = 1 + (hint(nm) ? 0.001 : 0) + (gd && dd === gd ? 0.002 : 0) - (gd && dd && dd !== gd ? 0.5 : 0); if (v > bs){ bs = v; best = nm; } }
      if (!best) best = lk;                             /* vínculo que não está no .dat: usa o próprio */
      tag = "vinc";
    } else {
      for (const nm of names){
        let v = similar(g, displayTitle(nm));
        if (v > 0 && hint(nm)) v += 0.001;              /* desempate: prefere a regiao que a pasta ja indica */
        if (v > 0 && gd){ const dd = discOf(nm); if (dd === gd) v += 0.002; else if (dd && dd !== gd) v -= 0.5; }   /* respeita o nº do disco */
        if (v > bs){ bs = v; best = nm; }
      }
      if (best && bs >= 0.55) tag = bs >= 0.82 ? "ok" : "near";
    }
    let to = (tag && best) ? folderSafe(best) : "";
    const hasSug = to && to !== g;
    if (!R.all){ if (matched || !hasSug) continue; }       /* modo normal: só os que não casam e têm sugestão */
    else if (!hasSug){ to = g; tag = undefined; }          /* "todos": sem sugestão, alvo = nome atual (editável) */
    if (R.edit[g] !== undefined) to = R.edit[g];           /* edição manual do alvo */
    const changed = !!(to && to !== g);
    const on = R.check[g] !== undefined ? R.check[g] : (changed && !!tag && tag !== "near");
    R.items.push({g, to, on, long: to.length > 25, score: bs, tag, matched, changed});
  }
  const cnt = new Map(); for (const it of R.items){ if (it.changed) cnt.set(it.to.toLowerCase(), (cnt.get(it.to.toLowerCase()) || 0) + 1); }
  for (const it of R.items){ const k = it.to.toLowerCase(); it.dup = it.changed && (cnt.get(k) > 1 || (taken.has(k) && taken.get(k) !== it.g)); }
}

function nameDiff(a, b){
  const n = a.length, m = b.length, W = m + 1, L = new Uint16Array((n + 1) * W);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i * W + j] = a[i] === b[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
  let i = 0, j = 0, A = "", B = "", da = "", db = "";

  while (i < n || j < m){

  const dir = await S.root.getDirectoryHandle(g);

async function renBat(){
  const sel = R.items.filter(x => x.on && !x.dup && x.changed); if (!sel.length) return;
  if (!confirm(t("r_confirm")(sel.length) + (R.files ? "\n\n" + t("r_confirm_files") : ""))) return;   /* conferência antes de baixar */
  const L = ["@echo off", "chcp 65001 >nul", "cd /d \"%~dp0\"",
             "echo Renomeando " + sel.length + " jogo(s) na pasta atual...", "echo."];
  const MED = [["covers", ".ngi"], ["screenshots", ".ngi"], ["videos", ".ngv"],      /* raiz antiga e a pasta .media */
               [".media\\covers_full", ".ngi"], [".media\\covers", ".ngi"], [".media\\covers128", ".ngi"], [".media\\covers_mini", ".ngi"],
               [".media\\screenshots", ".ngi"], [".media\\videos", ".ngv"], [".media\\texts", ".ngi"]];
  const IMGEXT = [".png", ".jpg", ".jpeg", ".webp", ".bmp", ".gif"];
  for (const it of sel){
    const a = batName(it.g), b = batName(it.to);
    L.push("echo " + batEcho(it.g) + "  ->  " + batEcho(it.to));
    if (R.files && !S.demo){
      try {
        const p = await innerRenamePlan(it.g, it.to);
        if (p){
          for (const [of_, nf] of p.files) L.push('if exist "' + a + "\\" + batName(of_) + '" ren "' + a + "\\" + batName(of_) + '" "' + batName(nf) + '"');   /* arquivos internos */
          const b64 = btoa(unescape(encodeURIComponent(p.cueText)));                          /* .cue novo via base64 + certutil (evita aspas/^ do cmd) */
          L.push('>"%TEMP%\\ngcd_cue.b64" echo ' + b64);
          L.push('certutil -f -decode "%TEMP%\\ngcd_cue.b64" "' + a + "\\" + batName(p.cueNew) + '" >nul');
          L.push('del "%TEMP%\\ngcd_cue.b64" >nul 2>&1');
          if (p.cueOld.toLowerCase() !== p.cueNew.toLowerCase()) L.push('if exist "' + a + "\\" + batName(p.cueOld) + '" del "' + a + "\\" + batName(p.cueOld) + '"');
        }
      } catch(e){ L.push("rem erro ao ler " + batEcho(it.g)); }
    }
    L.push('if exist "' + a + '\\" ren "' + a + '" "' + b + '"');                 /* a pasta do jogo (por último) */
    for (const [dir, ext] of MED)                                                  /* capa/tela/vídeo prontos (.ngi/.ngv) */
      L.push('if exist "' + dir + "\\" + a + ext + '" if not exist "' + dir + "\\" + b + ext + '" ren "' + dir + "\\" + a + ext + '" "' + b + ext + '"');
    for (const dir of ["covers", "screenshots"]) for (const e of IMGEXT)           /* imagens que a pessoa pôs nas pastas */
      L.push('if exist "' + dir + "\\" + a + e + '" if not exist "' + dir + "\\" + b + e + '" ren "' + dir + "\\" + a + e + '" "' + b + e + '"');
  }
  L.push("echo. & echo Pronto! Agora abra a pagina e grave o cartao de novo.", "pause");
  const blob = new Blob([L.join("\r\n") + "\r\n"], {type:"application/bat"});
  const u = URL.createObjectURL(blob), dl = document.createElement("a");
  dl.href = u; dl.download = "renomear_ngcd.bat"; dl.click();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
}
