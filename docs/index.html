const BOOT_DIRS = [".boot", "_BOOT"];     /* onde o menu pode estar no cartão (NGC17: .boot; antes: _BOOT) */
async function copyBootWad(){
  if (S.demo) return;
  if (S.o.o_boot){
    const iso = await bootIso();
    if (!iso) log(t("boot_copy"));
    else {
      /* menu 59: só .boot (padrão ODE). A página não copia mais para _BOOT: com o loader antigo (< NGCD 00.12 / NGC17,
         lido de info_loader no ngcdconfig.ode) ela avisa para atualizar o loader; o _BOOT velho fica como está. */
      const ldr = S.sav && S.sav.loader, newLoader = ldr >= 17;
      const v = bootVerOf(iso), bd = ".boot";
      let same = false;
      try { same = eqBytes(await readFile([bd], "BOOT.ISO"), iso); } catch(e){}
      if (same) log(bd + "/BOOT.ISO" + (v ? " (menu " + v + ")" : "") + ": " + t("ode_same"));
      else {
        await put([bd], "BOOT.ISO", iso);
        await put([bd], "BOOT.CUE", S.ownBoot && S.ownBoot.cue ? new Uint8Array(await S.ownBoot.cue.arrayBuffer()) : new TextEncoder().encode(BOOT_CUE));
        log(bd + "/BOOT.ISO" + (v ? " (menu " + v + ")" : "") + " " + t("copied") + ", " + kb(iso.length));
      }
      if (ldr && !newLoader) log("⚠ " + t("old_ldr")(ldr));
      if (newLoader){
        try {
          try { const l = await readFile(["_BOOT"], "LINKS.TXT"); try { await readFile([".boot"], "LINKS.TXT"); } catch(e){ await put([".boot"], "LINKS.TXT", l); } } catch(e){}
          await S.root.removeEntry("_BOOT", {recursive:true}); log(t("old_boot"));
        } catch(e){}
      }
      if (v) S.bootVer = v;
    }
  }
  if (S.o.o_wad){
    const w = latestWad();
    if (w){
      const d = new Uint8Array(await w.arrayBuffer()), others = [];
      let same = false;
      for await (const [n, h] of S.root.entries()){
        if (h.kind !== "file" || !/\.(wad|bak)$/i.test(n)) continue;      /* .BAK: menus 52-55 renomeavam o WAD instalado */
        const fl = await h.getFile();
        if (fl.size === d.length && eqBytes(new Uint8Array(await fl.arrayBuffer()), d)){ same = true; continue; }
        if (/\.bak$/i.test(n)) continue;
        if (n.toLowerCase() !== w.name.toLowerCase()) others.push(n);
      }
      /* o WAD já instalado vai para a pasta .wad/ (backup; menus 56-58: wad/): igual a um de lá = já instalado */
      for (const wdn of [".wad", "wad"]){
        if (same) break;
        try { const wd = await S.root.getDirectoryHandle(wdn);
          for await (const [n, h] of wd.entries()){
            if (h.kind !== "file" || !/\.wad$/i.test(n)) continue;
            const fl = await h.getFile();
            if (fl.size === d.length && eqBytes(new Uint8Array(await fl.arrayBuffer()), d)){ same = true; break; }
          } } catch(e){}
      }
      if (same) log(w.name + ": " + t("ode_same"));
      else { await put([], w.name, d); log(w.name + " " + t("copied")); }
      if (others.length) log(t("ode_wads")(others.join(", ")));
    }
  }
}

    const total = jobs.length + vidGames.length + S.games.length + 2;
    let done = 0, next = 0;
    async function worker(){
      while (next < jobs.length && !S.stop){
        const j = jobs[next++], K = KINDS[j.kind];
        tick(K.log, true);
        try {
          let d;
          if (S.demo) d = new Uint8Array(4000);
          else if (mediaOut && j.st === "card" && inMedia(j.kind, j.g)) d = "media";     /* já está no .media: fica */
          else d = await ngiOf(j.g, j.kind);
          if (!S.demo){
            if (d === "media" || j.st === "card") count[K.log][1]++;
            else { count[K.log][0]++; if (!mediaOut){ await put([K.dirs[0]], j.g + ".ngi", d); files++; bytes += d.length; log(K.dirs[0] + "/" + j.g + ".ngi"); } }
          }
          if (d === "media" || ngiOk(d) || S.demo) ngi[j.kind].set(j.g, d);
        } catch(e){ log(t("err") + ": " + j.g + " — " + e.message); (lack[K.log] = lack[K.log] || []).push(j.g); }
        tick(K.log);
        progress(++done, total, t(K.log) + ": " + j.g);
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    for (const l of Object.keys(count)) log(t(l) + ": " + t("conv")(count[l][0], count[l][1]) + (lack[l] ? " · " + t("nomatch")(lack[l].length) : ""));
    /* o menu: os arquivos do boot + o índice + as capas e telas, num ISO só */
    /* os vídeos (.ngv já convertidos): da sua pasta, do cartão ou da biblioteca; os que vêm de fora são copiados para videos/ */
    const ngvs = new Map();
    if (vidGames.length && !S.stop){
      tick("l_vid", true); let nNew = 0;
      for (const g of vidGames){
        if (S.stop) break;
        const st = vidStatus(g);
        if (mediaOut && st === "card" && mhas(S.mediaVid, g)) ngvs.set(g, "media");     /* já está no .media: fica */
        else {
          const d = await ngvOf(g);
          if (ngvOk(d)){ ngvs.set(g, d); if (st !== "card"){ nNew++; if (!mediaOut){ files++; bytes += d.length; } log((mediaOut ? ".media/videos/" : "videos/") + g + ".ngv"); } }
          else { log(t("err") + ": " + g + " — .ngv"); (lack.l_vid = lack.l_vid || []).push(g); }
        }
        tick("l_vid"); progress(++done, total, t("l_vid") + ": " + g);
      }
      log(t("l_vid") + ": " + ngvs.size + (nNew ? " (+" + nNew + (mediaOut ? " → .media/videos/)" : " → videos/)") : ""));
    }
    if (!S.stop){
      tick("l_txt", true);
      await loadTexts();
      tick("l_txt");
      tick("l_boot", true);
      const isoFiles = mediaOut ? [] : (await loadMenu()).filter(([n]) => n !== "MEDIA.PRG").map(x => x.slice());
      let bigOk = true;
      if (mediaOut){ for (const dd of [".media", ".media/covers_full", ".media/covers", ".media/covers128", ".media/covers_mini", ".media/covers96", ".media/screenshots", ".media/videos", ".config", ".saves"]) try { await dirAt(dd.split("/"), true); } catch(e){} }
      const entries = [], descs = []; let nc = 0, ns = 0, nd = 0, nt = 0, nv = 0;
      const PK = !!S.o.o_pak, pakAcc = {covers:[], screenshots:[]}; let pakNew = false;     /* menu 70 */
      for (const g of S.games){
        const info = gameInfo(g), dsc = descFile(info); let did = null;
        descs.push(dsc);     /* menu 52: a descrição vai dentro do .config/ngcdgamelist.ode (sem a pasta texts) */
        if (dsc){ did = nd++; if (!mediaOut) isoFiles.push(["D" + String(did).padStart(4, "0") + ".PRG", dsc]); }
        if (info.title) nt++; else (lack.l_txt = lack.l_txt || []).push(g);
        const ids = [];
        for (const [kind, letter] of [["covers", "C"], ["screenshots", "S"]]){
          let d = ngi.covers && ngi[kind].get(g);
          /* a imagem só existe na .media do cartão (sem fonte no PC/biblioteca): continua valendo. Sem isto a coluna
             "mídias" do ngcdgamelist.ode saía vazia e o menu não mostrava as capas (menu 56, 26/11) */
          if (!d && mediaOut && inMedia(kind, g)) d = "media";
          if (!d || S.demo){ ids.push(null); continue; }
          const n = kind === "covers" ? nc++ : ns++, num = String(n).padStart(4, "0");
          ids.push(n);     /* id sempre (o índice diz que a capa existe); no mediaOut o arquivo vai pro .media, não pro ISO */
          if (mediaOut && PK){   /* menu 70: formato PAK — junta na memória; grava os 2 paks no fim (nada solto) */
            const full = d === "media" ? await mediaImg(letter === "C" ? "covers_full" : "screenshots", g) : d;
            if (!full){ continue; }
            if (letter === "C"){
              const one = async (sub, mk) => { if (d === "media"){ const f = await mediaImg(sub, g); if (f) return f; } try { return await mk(); } catch(e){ return null; } };
              const vs = [full, await one("covers", () => gridOf(full)), await one("covers128", () => bigNgiOf(g, full)),
                          await one("covers_mini", () => miniOf(full)), await one("covers96", () => d === "media" ? midOf(full) : midNgiOf(g, full))];
              if (!vs[2]) bigOk = false;
              pakAcc.covers.push([g, vs]);
            } else pakAcc.screenshots.push([g, [full]]);
            if (d !== "media") pakNew = true;
            continue;
          }
          if (mediaOut){   /* SÓ .media, pelo nome do jogo (ISO pequeno; o menu lê o .media por nome) */
            if (d === "media" && !PK){                   /* menu 70: veio de um pak e agora é Individual: solta os arquivos */
              const ps = PAK_SETS[kind];
              for (const sub of ps.dirs){ try { await readFile([".media", sub], g + ".ngi"); } catch(e){ const f = await mediaImg(sub, g); if (f){ await put([".media", sub], g + ".ngi", f); files++; bytes += f.length; } } }
            }
            if (d === "media"){                          /* já está no .media (Manter): nem recalcula... */
              if (letter === "C" && !(S.mediaMid && S.mediaMid.has(norm(g)))) try {   /* ...só falta a de 96 (menu 62) */
                const full = await readFile([".media", "covers_full"], g + ".ngi");
                const gm = await midOf(full); await put([".media", "covers96"], g + ".ngi", gm); files++; bytes += gm.length;
              } catch(e){}
              continue;
            }
            if (letter === "C"){
              try { await put([".media", "covers_full"], g + ".ngi", d); files++; bytes += d.length; } catch(e){}
              try { const g64 = await gridOf(d); await put([".media", "covers"], g + ".ngi", g64); files++; bytes += g64.length; } catch(e){}
              try { const gbig = await bigNgiOf(g, d); await put([".media", "covers128"], g + ".ngi", gbig); files++; bytes += gbig.length; } catch(e){ bigOk = false; }
              try { const gmini = await miniOf(d); await put([".media", "covers_mini"], g + ".ngi", gmini); files++; bytes += gmini.length; } catch(e){}
              try { const gm = await midNgiOf(g, d); await put([".media", "covers96"], g + ".ngi", gm); files++; bytes += gm.length; } catch(e){}
            } else { await put([".media", "screenshots"], g + ".ngi", d); files++; bytes += d.length; }
            continue;
          }
          isoFiles.push([letter + num + ".PRG", d]);     /* o .ngi inteiro (o menu sobe os tiles nos VBlanks) */
          if (letter === "C"){
            try { isoFiles.push(["G" + num + ".PRG", await gridOf(d)], ["K" + num + ".PRG", await miniOf(d)]); } catch(e){}
            try { isoFiles.push(["L" + num + ".PRG", await bigNgiOf(g, d)]); } catch(e){ bigOk = false; }   /* capa grande do Carrossel */
          }
        }
        let vid = null;
        if (!S.demo && (ngvs.get(g) === "media" || (mediaOut && !ngvs.get(g) && mhas(S.mediaVid || new Map(), g)))) vid = nv++;     /* já está no .media */
        else if (!S.demo && o.o_vid){ const d = ngvs.get(g); if (ngvOk(d)){ vid = nv++;
          if (mediaOut){ await put([".media", "videos"], g + ".ngv", d); files++; bytes += d.length; }
          else { isoFiles.push(...ngvParts(String(vid).padStart(4, "0"), d)); } } }
        entries.push([g, ids[0], ids[1], did, info, vid]);
        tick("l_boot"); progress(++done, total, t("l_boot") + ": " + g);
      }
      log(t("l_txt") + ": " + t("texts")(nt, S.games.length));
      const idx = mediaIndex(entries, bigOk ? 11 : 10);
      if (mediaOut){   /* 3DO: NÃO constrói o ISO; o BOOT.ISO é COPIADO (estático) */
        await copyBootWad();
        const gl = +S.bootVer >= 54 || !S.bootVer ? glText(entries, bigOk) : mediaIndex(entries, bigOk ? 12 : 13, descs);   /* menu 54+: texto (como o 3DO) */
        if (await putIfChanged([".config"], "ngcdgamelist.ode", gl)){ files++; bytes += gl.length; }
        if (+S.bootVer >= 52){     /* o menu do cartão já lê o .config: o índice e os textos antigos saem */
          try { const md = await dirAt([".media"], false); try { await md.removeEntry("MEDIA.PRG"); } catch(e){} try { await md.removeEntry("texts", {recursive:true}); } catch(e){} } catch(e){}
        } else if (await putIfChanged([".media"], "MEDIA.PRG", idx)){ files++; bytes += idx.length; }   /* menu antigo no cartão */
        try { const [pn, pb] = await finishPaks(PK, pakAcc); files += pn; bytes += pb; } catch(e){ log("pak: " + e.message); }   /* menu 70 */
        log(".config/ngcdgamelist.ode + mídias (" + nc + " " + t("l_cov").toLowerCase() + ", " + ns + " " + t("l_shot").toLowerCase() + (nv ? ", " + nv + " vídeo(s)" : "") + ")");
      } else {
        isoFiles.push(["MEDIA.PRG", idx]);
        const iso = buildIso(isoFiles);
        await put([".boot"], "BOOT.ISO", iso); await put([".boot"], "BOOT.CUE", new TextEncoder().encode(BOOT_CUE));
        files += 2; bytes += iso.length; S.bootVer = MENU_VERSION;
        log(t("l_boot") + ": MENU " + MENU_VERSION + ", " + kb(iso.length) + " (" + nc + " " + t("l_cov").toLowerCase() + ", " + ns + " " + t("l_shot").toLowerCase() + (nv ? ", " + nv + " vídeo(s)" : "") + ")");
      }
      tick("l_boot");
    }
    progress(++done, total, t("l_boot"));
    /* as opções do menu: só se mexeu aqui ou se o cartão ainda não tem o arquivo; favoritos e estatísticas ficam */
    if (!S.stop && (S.cfgTouched || !S.sav)){
      tick("l_cfg", true);
      const rest = S.sav ? S.sav.rest : new Uint8Array(CFG_REST), opts = optsFromCfg(S.cfg, S.sav && S.sav.opts);
      if ((S.sav && S.sav.ode) || +S.bootVer >= 52){      /* menu 52+: .config/ngcdconfig.ode (o .SAV antigo fica, o menu migra) */
        const body = await writeOdeCfg(opts); files++; bytes += body.length;
        S.sav = (await readOde()) || S.sav; S.cfgTouched = false;
        log(t("l_cfg") + ": .config/ngcdconfig.ode");
      } else {
      const body = buildSav(opts, rest);
      await put([], CFG_FILE, body); files++; bytes += body.length;
      try { await S.root.removeEntry(CFG_OLD); } catch(e){}     /* o nome antigo sai do cartão */
      S.sav = parseSav(body.buffer); S.cfgTouched = false;
      log(t("l_cfg") + ": " + CFG_FILE);
      }
      tick("l_cfg");
    }
    progress(++done, total, "");
    if (S.stop) log(t("stopped"));
    else {
      progress(1, 1, "");
      finished = true;
      $("done").innerHTML = `<div class="done"><h3>${esc(t("done_t"))}</h3>${esc(t("files"))}: <b>${files}</b><br>${esc(t("size"))}: <b>${kb(bytes)}</b><br>${esc(t("time"))}: <b>${human(Date.now() - t0)}</b><p style="margin:.5rem 0 0">${esc(t("done_p"))}</p></div>` + missHtml(lack);
      const dl = $("dl"); if (dl) dl.onclick = () => {
        const txt = Object.keys(lack).map(k => t(k).toUpperCase() + " (" + lack[k].length + ")\r\n" + lack[k].join("\r\n")).join("\r\n\r\n") + "\r\n";
        const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + txt], {type:"text/plain"})); a.download = "neogeocd-faltando.txt"; a.click();
      };
      if (!S.demo){ await readCard(); coverCache.clear(); }
      if (libHasOwn()){ const d = $("done"); if (d) d.insertAdjacentHTML("beforeend", `<button class="opt top act" id="lbsend" style="margin-top:10px"><span>${esc(t("done_send"))}</span><b>📤</b></button>`); const b = $("lbsend"); if (b) b.onclick = sendLib; }
    }
  } catch(e){
    if (e.name === "InvalidStateError"){ log(t("stale")); try { await readCard(); coverCache.clear(); } catch(e2){} }
    else log((e.name === "Busy" ? "" : t("err") + ": ") + e.message);
  }
  S.busy = false; $("start").disabled = false; $("stop").disabled = true;
  if (finished){ $("start").hidden = true; $("stop").hidden = true; }
  document.querySelectorAll("#keys button").forEach(b => b.disabled = false);
}

draw();
if (Q.get("demo")) act("demo");
/* Para os testes automáticos. */
window.NGCD = {norm, toNgi, ngiImage, ngiSplit, ngvSplit, buildIso, mediaIndex, parseSav, buildSav, optsFromCfg, cfgFromOpts, cfgDefaults, loadMenu, S, act, go, status};
</script>
</body>
